# OPD Operational Facts - typed load-bearing values
#
# Validated against content/schema/facts.schema.json.
# Per F3 (built 2026-06-15 from Kevin's confirmed set + Tier 2 shells):
#   - Tier 1: 25 global facts, defaults + authorities Kevin-confirmed
#   - Tier 2: 7 override-bearing facts:
#       - 3 floor-confirmed (sick_accrual, overtime_threshold, record_retention_disciplinary)
#       - 4 quarantined (meal_break_rule, rest_break_rule, pay_band_hourly, pay_band_leadership)
#         flagged non_canonical: true so the resolver knows the value is unresolved;
#         the corpus must NOT teach Sous a quarantined fact as canonical.
#
# State-variant population happens at F4 / F5 once counsel + Finance confirm.
# Pay bands (REF-006, REF-007) stay in_corpus:false until Finance validates against
# Rippling. Meal/rest breaks stay quarantined until counsel completes per-state research.

