name: purchasing sync (billcom bills + credits + rippling spend)

# Nightly ingest of bill.com bills + bill.com vendor credits + Rippling
# card spend into Postgres for KPI PURCHASING PHASE 1 (spec §2). Three
# independent sync scripts, sequential: bills first (references + bills
# + derive), credits second (walks /vendor-credits, derives against the
# just-refreshed ref-accounts), Rippling spend third.
#
# One script per source keeps the lock granularity clean:
#   purchasing_sync_locks: holder='purchasing_billcom_sync'
#   purchasing_sync_locks: holder='purchasing_rippling_sync'
# The lock rows are independent so an operator running one manually
# does not block the other's nightly. The credits sync does not
# currently take a lock row (its writes are scoped by
# source='billcom_credit' and touched_credit_ids, so concurrent runs
# would re-derive the same rows deterministically); if a real
# collision surfaces, add a 'purchasing_billcom_credits_sync' lock.
#
# Reason for a NEW workflow (vs extending rippling-sync.yml):
#   1. rippling-sync.yml runs the LABOR pipeline (4 walks + labor
#      derive) with a ~30-minute total budget. Adding a bill.com pass
#      whose latency is dominated by a proxy (Josh's ngrok) puts the
#      combined workflow well over the 90-minute mark on any bill.com
#      slowness - and the labor path is production, blast-radius high.
#   2. Failure isolation: a bill.com proxy 500 must NOT fail the labor
#      derive. Separate workflows mean a red purchasing check does not
#      hide a green labor check.
#   3. Different secrets scope: BILLCOM_PROXY_BASE / BILLCOM_PROXY_KEY
#      are net-new; scoping them to a purchasing workflow keeps the
#      labor workflow's secret surface unchanged.
#   4. Different cron slot: labor runs at 07:00 UTC; purchasing runs at
#      07:30 UTC so if labor is still finishing (in-season peak), the
#      two never race on the shared Actions runner budget.
#
# Failure surface:
#   exit 2 = walk failed mid-flight (partial data in raw tables)
#   exit 3 = another sync in flight (lock)
#   exit 4 = probes failed (data landed but not spec-compliant)
# Every non-zero fails the job. GitHub concurrency: block prevents a
# second scheduled trigger from stepping on this one; the lock table
# handles cross-environment (local + Action) collisions.

on:
  schedule:
    - cron: '30 7 * * *'   # 07:30 UTC = 02:30 CST / 03:30 CDT
  workflow_dispatch:
    inputs:
      source:
        description: 'fetch_source value (nightly | backfill | manual | fytd for billcom). Default nightly.'
        required: false
        default: 'nightly'
      period:
        description: 'fiscal period 1..13 (required when source=fytd)'
        required: false
        default: ''
      dry_run:
        description: 'If "true", walk sources but skip Postgres writes.'
        required: false
        default: 'false'

concurrency:
  group: purchasing-sync
  cancel-in-progress: false

jobs:
  sync:
    name: purchasing sync (billcom bills + credits + rippling spend)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      BILLCOM_PROXY_BASE:       ${{ secrets.BILLCOM_PROXY_BASE }}
      BILLCOM_PROXY_KEY:        ${{ secrets.BILLCOM_PROXY_KEY }}
      RIPPLING_API_KEY:         ${{ secrets.RIPPLING_API_KEY }}
      SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run billcom sync
        id: billcom
        run: |
          SOURCE="${{ inputs.source || 'nightly' }}"
          DRY_RUN="${{ inputs.dry_run || 'false' }}"
          PERIOD="${{ inputs.period || '' }}"
          ARGS="--source=${SOURCE}"
          if [ "${SOURCE}" = "fytd" ] && [ -n "${PERIOD}" ]; then
            ARGS="${ARGS} --period=${PERIOD}"
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS="${ARGS} --dry-run"
          fi
          echo "purchasing_billcom_sync ${ARGS}"
          node scripts/purchasing_billcom_sync.mjs ${ARGS}

      # bill.com vendor credits sync (R-71). Ships credits from the
      # /vendor-credits proxy endpoint into billcom_raw_vendor_credits
      # + billcom_raw_vendor_credit_lines, then derives into
      # purchasing_actuals (source='billcom_credit').
      #
      # Placed AFTER the bills sync deliberately - the bills sync
      # refreshes billcom_ref_accounts, and the credits derive reads
      # chart_of_account_id -> gl_line_code from that table. Running
      # credits BEFORE bills risks deriving against a stale ref table.
      # (The credits sync itself now has a HIT_CAP guard that fails
      # loudly if the ref-accounts load truncates; the ordering here
      # is defence-in-depth on top of that.)
      #
      # Uses `if: always()` for the same reason rippling does:
      # bill.com's /vendor-credits and /bills endpoints are proxied
      # independently, so a bills-endpoint failure should NOT skip
      # the credits refresh. Aggregate workflow status stays RED on
      # any step failure.
      - name: Run billcom vendor credits sync
        if: always()
        id: billcom_credits
        run: |
          SOURCE="${{ inputs.source || 'nightly' }}"
          DRY_RUN="${{ inputs.dry_run || 'false' }}"
          ARGS="--source=${SOURCE}"
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS="${ARGS} --dry-run"
          fi
          echo "purchasing_billcom_credits_sync ${ARGS}"
          node scripts/purchasing_billcom_credits_sync.mjs ${ARGS}

      # Rippling spend sync runs regardless of billcom outcome (`if:
      # always()`). Rationale: the two data lanes are independent; a
      # bill.com proxy 500 must not skip the card-spend refresh. If
      # billcom failed the job already, this step still runs so the
      # rippling side of purchasing_actuals stays current, and the
      # workflow's aggregate status remains RED (jobs return the worst
      # exit code across all steps).
      - name: Run rippling spend sync
        if: always()
        id: rippling
        run: |
          SOURCE_IN="${{ inputs.source || 'nightly' }}"
          # rippling script rejects 'fytd' - normalize to 'nightly' for
          # the rippling step regardless of billcom's source value.
          case "${SOURCE_IN}" in
            backfill|nightly|manual) SOURCE="${SOURCE_IN}" ;;
            *)                       SOURCE="nightly" ;;
          esac
          DRY_RUN="${{ inputs.dry_run || 'false' }}"
          ARGS="--source=${SOURCE}"
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS="${ARGS} --dry-run"
          fi
          echo "purchasing_rippling_sync ${ARGS}"
          node scripts/purchasing_rippling_sync.mjs ${ARGS}
