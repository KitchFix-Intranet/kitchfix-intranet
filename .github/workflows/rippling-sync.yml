name: rippling raw sync + labor derivation

# Nightly ingest of raw Rippling records into Postgres (PR 8a + 8a-2)
# followed by the labor_actuals derivation (PR 8b).
#
# Four Rippling walks per run, sequential:
#   /time-entries                                    -> rippling_raw_time_entries
#   /custom-objects/time_entry_computed_pay_segment  -> rippling_raw_pay_segments
#   /workers                                         -> rippling_raw_workers
#   /custom-objects/time_entry_zo                    -> rippling_raw_time_entry_zo
#
# On sync success, the derivation step runs. It reads presence
# (rippling_current_presence), earning_type_map, rippling_department_map,
# and the four raw _latest views; upserts labor_actuals per account via
# swap_labor_actuals_for_account; and writes labor_unattributed +
# earning_type_unmapped. Full re-derive per D38 - no incremental logic.
#
# The derivation is gated on sync success (per B6). A partial or failed
# sync must NOT trigger the derivation - deriving over half-updated
# presence produces confidently wrong numbers, which is the failure this
# whole project exists to prevent.
#
# Filter surface on the Rippling side is zero - date, worker_id, and sort
# filters are silently ignored. Full cursor walk from the first page every
# time. Content-hash uniqueness (kpi-8a-rippling-raw.sql) makes re-fetching
# cheap: unchanged records are dropped by ON CONFLICT DO NOTHING.
#
# Measured mean latency (2026-08-04 discovery probe):
#   /time-entries    ~8.08s / page  ~200 pages  ~27 min
#   /pay_segments    ~1.50s / page  ~80  pages  ~2 min
#   /workers         ~1.5s  / page  ~12  pages  ~18 s
#   /time_entry_zo   ~1s    / page  ~82  pages  ~65 s
# Combined sync ~30 min; derivation adds ~30-60s. timeout-minutes 120
# gives real headroom for in-season volume + derive. Vercel's 300s
# function cap does not fit, which is why this lives in Actions rather
# than as an API cron.
#
# Failure surface: exit 2 from the sync script means at least one walk
# failed mid-flight. Exit 3 from derive means derive duration exceeded
# 10 minutes (D38 trigger to revisit). Either exit code fails the whole
# workflow. The other walk's progress still landed via the per-page
# upsert - re-run picks up unchanged records for near-zero cost.

on:
  schedule:
    # 07:00 UTC = 02:00 CST / 03:00 CDT - after nightly Rippling posts
    # and inside Kevin's quiet hours.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Value written to rippling_raw_*.fetch_source (nightly | backfill | manual). Default nightly.'
        required: false
        default: 'nightly'
      dry_run:
        description: 'If "true", walk Rippling but skip Postgres writes.'
        required: false
        default: 'false'

concurrency:
  group: rippling-raw-sync
  cancel-in-progress: false

jobs:
  sync:
    name: walk 4 raw objects + derive labor_actuals
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      RIPPLING_API_KEY: ${{ secrets.RIPPLING_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Failure surface (2026-08-27). Reuses the SC webhook already
      # wired to schedule-drift + price-change-nightly; no new secret.
      # This job failed silently six nights in a row before Kevin
      # noticed in the Actions UI - a nightly job whose failure
      # produces no signal is the same class as the guard defects
      # this week. One message per failed night, step name + run URL.
      SLACK_SC_WEBHOOK_URL: ${{ secrets.SLACK_SC_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run rippling sync
        id: sync
        run: |
          SOURCE="${{ inputs.source || 'nightly' }}"
          DRY_RUN="${{ inputs.dry_run || 'false' }}"
          ARGS="--source=${SOURCE}"
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS="${ARGS} --dry-run"
          fi
          echo "rippling_sync ${ARGS}"
          node scripts/rippling_sync.mjs ${ARGS}

      # Derivation runs ONLY on sync success. Explicit `if: success()`
      # rather than relying on GHA's default step semantics - the
      # 2026-06-12 silent-gap class is exactly the case where a
      # fail-open guard produced confidently wrong numbers. Dry-run of
      # sync skips derive (nothing to derive against a preview).
      - name: Derive labor actuals
        id: derive_weekly
        if: success() && (inputs.dry_run || 'false') != 'true'
        run: |
          SOURCE="${{ inputs.source || 'nightly' }}"
          echo "derive_labor_actuals --source=${SOURCE}"
          node scripts/derive_labor_actuals.mjs --source=${SOURCE}

      # Daily grain rebuild - same input as the weekly, bucketed by
      # segment_date. Runs AFTER Derive labor actuals so the D1
      # reconciliation probe reads a stable weekly. --window=trailing8
      # matches the weekly + salary derives; --window=fytd stays
      # manual-only. Same shared dedupe helper as the weekly so a
      # tripled-Tuesday cannot happen without also tripling the week.
      - name: Derive labor actuals daily
        id: derive_daily
        if: success() && (inputs.dry_run || 'false') != 'true'
        run: |
          SOURCE="${{ inputs.source || 'nightly' }}"
          echo "note: weekly derive already wrote successfully; failure here isolates to the daily rollup"
          echo "derive_labor_actuals_daily --source=${SOURCE} --window=trailing8"
          node scripts/derive_labor_actuals_daily.mjs --source=${SOURCE} --window=trailing8

      - name: Daily grain probes
        id: probe_grain
        if: success() && (inputs.dry_run || 'false') != 'true'
        run: |
          echo "probe_daily_grain"
          node scripts/probes/_probe_daily_grain.mjs

      # Salary derive rebuilds the trailing 8 fiscal weeks of
      # labor_salary_actuals so a late-entered raise or a backdated
      # termination self-heals without anyone touching a script.
      # Runs AFTER Derive labor actuals - if this step goes red, the
      # log makes plain that HOURLY already wrote successfully and
      # only SALARY is stale. --window=fytd stays manual-only.
      - name: Derive salary actuals
        id: derive_salary
        if: success() && (inputs.dry_run || 'false') != 'true'
        run: |
          SOURCE="${{ inputs.source || 'nightly' }}"
          echo "note: hourly derive already wrote successfully; failure here isolates to salary"
          echo "derive_salary_actuals --source=${SOURCE} --window=trailing8"
          node scripts/derive_salary_actuals.mjs --source=${SOURCE} --window=trailing8

      # People roster is one clean nightly snapshot derived from the
      # workers + users walks the sync step just landed.
      #
      # 2026-08-27 decoupling (owner ruling): gate on
      # `steps.sync.outcome == 'success'` NOT `success()`. Prior state:
      # `if: success()` chained People-derive behind every labor
      # derive. When labor derive hit a Postgres statement timeout on
      # Aug 22, People derive stopped running - directory went stale
      # for six days because a labor query got slow. The two concerns
      # are unrelated: People derive reads workers + users walks only,
      # never labor tables. The coupling was the design flaw; the
      # timeout just exposed it. Keep this even after the timeout is
      # fixed - a directory should not go stale because an unrelated
      # derive is broken.
      #
      # Owner columns (is_site_leader / site_leader_note) are
      # preserved by the derive's explicit upsert column list; probe
      # P3 gates that contract on every run.
      - name: Derive people
        id: derive_people
        if: steps.sync.outcome == 'success' && (inputs.dry_run || 'false') != 'true'
        run: |
          SOURCE="${{ inputs.source || 'nightly' }}"
          echo "derive_people --source=${SOURCE}"
          node scripts/derive_people.mjs --source=${SOURCE}

      # P1..P6 acceptance. FAIL fails the job. The probe itself runs
      # the derive a second time (P3 dynamic + P6 idempotency); the
      # earlier Derive people step is the first run.
      #
      # 2026-08-27: also gated on sync only, matches Derive people.
      # Probe should run whenever the derive it validates ran.
      - name: People probes
        id: probe_people
        if: steps.derive_people.outcome == 'success' && (inputs.dry_run || 'false') != 'true'
        run: |
          echo "probe_people"
          node scripts/probes/_probe_people.mjs

      # Failure surface (2026-08-27). Fires on ANY prior step failure.
      # Posts one compact message to the SC channel with the failed
      # step name and a run URL. Does not fire on dry-run. If the
      # webhook itself is missing or fails, the workflow already
      # failed - we don't want to mask that; `continue-on-error: true`
      # so a webhook error does not turn a real failure into a
      # different-looking failure.
      #
      # This is the "did the pipeline run" surface. The board's
      # derived_at staleness banner is the "am I looking at fresh
      # data" surface - both landing in the same PR because a nightly
      # job that fails silently misled Kevin for six days on this
      # exact defect.
      - name: Post failure to Slack
        if: failure() && (inputs.dry_run || 'false') != 'true'
        continue-on-error: true
        env:
          SYNC:          ${{ steps.sync.outcome }}
          DERIVE_WEEKLY: ${{ steps.derive_weekly.outcome }}
          DERIVE_DAILY:  ${{ steps.derive_daily.outcome }}
          PROBE_GRAIN:   ${{ steps.probe_grain.outcome }}
          DERIVE_SALARY: ${{ steps.derive_salary.outcome }}
          DERIVE_PEOPLE: ${{ steps.derive_people.outcome }}
          PROBE_PEOPLE:  ${{ steps.probe_people.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "${SLACK_SC_WEBHOOK_URL}" ]; then
            echo "SLACK_SC_WEBHOOK_URL absent - skipping post"
            exit 0
          fi
          # First failed step wins. Order matches the pipeline sequence,
          # so the name reported is the earliest failure (later steps
          # never ran because of `if: success()`).
          if   [ "${SYNC}"          = "failure" ]; then FAILED_STEP="Run rippling sync"
          elif [ "${DERIVE_WEEKLY}" = "failure" ]; then FAILED_STEP="Derive labor actuals"
          elif [ "${DERIVE_DAILY}"  = "failure" ]; then FAILED_STEP="Derive labor actuals daily"
          elif [ "${PROBE_GRAIN}"   = "failure" ]; then FAILED_STEP="Daily grain probes"
          elif [ "${DERIVE_SALARY}" = "failure" ]; then FAILED_STEP="Derive salary actuals"
          elif [ "${DERIVE_PEOPLE}" = "failure" ]; then FAILED_STEP="Derive people"
          elif [ "${PROBE_PEOPLE}"  = "failure" ]; then FAILED_STEP="People probes"
          else FAILED_STEP="unknown step"
          fi
          PAYLOAD=$(printf '{"text":"rippling sync failed at *%s*\\n<%s|Run #%s>"}' \
            "${FAILED_STEP}" "${RUN_URL}" "${RUN_NUMBER}")
          curl -sS -X POST -H 'Content-Type: application/json' -d "${PAYLOAD}" "${SLACK_SC_WEBHOOK_URL}" || true
