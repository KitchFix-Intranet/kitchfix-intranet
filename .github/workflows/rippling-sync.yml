name: rippling raw sync + labor derivation

# Nightly ingest of raw Rippling records into Postgres (PR 8a + 8a-2
# + C5 + salary PR 1) followed by the labor_actuals and
# labor_salary_actuals derivations.
#
# Six Rippling walks per run, sequential:
#   /time-entries                                    -> rippling_raw_time_entries
#   /custom-objects/time_entry_computed_pay_segment  -> rippling_raw_pay_segments
#   /workers                                         -> rippling_raw_workers
#   /custom-objects/time_entry_zo                    -> rippling_raw_time_entry_zo
#   /users                                           -> rippling_raw_users
#   /compensations                                   -> rippling_raw_compensations
#
# On sync success, the derivation step runs. It reads presence
# (rippling_current_presence), earning_type_map, rippling_department_map,
# and the four raw _latest views; upserts labor_actuals per account via
# swap_labor_actuals_for_account; and writes labor_unattributed +
# earning_type_unmapped. Full re-derive per D38 - no incremental logic.
#
# The derivation is gated on sync success (per B6). A partial or failed
# sync must NOT trigger the derivation - deriving over half-updated
# presence produces confidently wrong numbers, which is the failure this
# whole project exists to prevent.
#
# Filter surface on the Rippling side is zero - date, worker_id, and sort
# filters are silently ignored. Full cursor walk from the first page every
# time. Content-hash uniqueness (kpi-8a-rippling-raw.sql) makes re-fetching
# cheap: unchanged records are dropped by ON CONFLICT DO NOTHING.
#
# Measured mean latency (2026-08-04 discovery probe):
#   /time-entries    ~8.08s / page  ~200 pages  ~27 min
#   /pay_segments    ~1.50s / page  ~80  pages  ~2 min
#   /workers         ~1.5s  / page  ~12  pages  ~18 s
#   /time_entry_zo   ~1s    / page  ~82  pages  ~65 s
# Combined sync ~30 min; derivation adds ~30-60s. timeout-minutes 120
# gives real headroom for in-season volume + derive. Vercel's 300s
# function cap does not fit, which is why this lives in Actions rather
# than as an API cron.
#
# Failure surface: exit 2 from the sync script means at least one walk
# failed mid-flight. Exit 3 from derive means derive duration exceeded
# 10 minutes (D38 trigger to revisit). Either exit code fails the whole
# workflow. The other walk's progress still landed via the per-page
# upsert - re-run picks up unchanged records for near-zero cost.

on:
  schedule:
    # 07:00 UTC = 02:00 CST / 03:00 CDT - after nightly Rippling posts
    # and inside Kevin's quiet hours.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Value written to rippling_raw_*.fetch_source (nightly | backfill | manual). Default nightly.'
        required: false
        default: 'nightly'
      dry_run:
        description: 'If "true", walk Rippling but skip Postgres writes.'
        required: false
        default: 'false'

concurrency:
  group: rippling-raw-sync
  cancel-in-progress: false

jobs:
  sync:
    name: walk 4 raw objects + derive labor_actuals
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      RIPPLING_API_KEY: ${{ secrets.RIPPLING_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run rippling sync
        id: sync
        run: |
          SOURCE="${{ inputs.source || 'nightly' }}"
          DRY_RUN="${{ inputs.dry_run || 'false' }}"
          ARGS="--source=${SOURCE}"
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS="${ARGS} --dry-run"
          fi
          echo "rippling_sync ${ARGS}"
          node scripts/rippling_sync.mjs ${ARGS}

      # Derivation runs ONLY on sync success. Explicit `if: success()`
      # rather than relying on GHA's default step semantics - the
      # 2026-06-12 silent-gap class is exactly the case where a
      # fail-open guard produced confidently wrong numbers. Dry-run of
      # sync skips derive (nothing to derive against a preview).
      - name: Derive labor actuals
        if: success() && (inputs.dry_run || 'false') != 'true'
        run: |
          SOURCE="${{ inputs.source || 'nightly' }}"
          echo "derive_labor_actuals --source=${SOURCE}"
          node scripts/derive_labor_actuals.mjs --source=${SOURCE}

      # Salary PR 1 · nightly salary derive. Trailing-8-weeks window
      # is the same idempotent rebuild pattern the hourly derive uses:
      # a late-entered raise / termination / transfer self-heals on
      # the next run without a manual step. Runs only on sync success
      # (same silent-gap gate); dry-run of sync skips it.
      - name: Derive salary actuals
        if: success() && (inputs.dry_run || 'false') != 'true'
        run: |
          SOURCE="${{ inputs.source || 'nightly' }}"
          echo "derive_salary_actuals --source=${SOURCE} --window=trailing8"
          node scripts/derive_salary_actuals.mjs --source=${SOURCE} --window=trailing8
