<meta charset="utf-8">
<title>KPI Overview - interactive prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--navy-50:#F4F7FC;--navy-100:#EAF0FA;--navy-600:#33527D;--navy-700:#153968;--navy-800:#092B55;
--amber-50:#FFF2E2;--amber-500:#D97706;--amber-600:#B25800;
--green-50:#E9FDEC;--green-500:#16A34A;--green-600:#008330;
--red-50:#FFEDE7;--red-500:#DC2626;--red-600:#B9000C;
--n-0:#FFFFFF;--n-50:#F8FAFC;--n-100:#F1F5F9;--n-200:#E7EDF4;--n-300:#DDE5EE;
--n-400:#CBD5E1;--n-500:#94A3B8;--n-600:#64748B;--n-700:#475569;--n-900:#0A2548;
--purple:#7c3aed;--s:0.9;
--t-lab:calc(10px*var(--s));--t-met:calc(11px*var(--s));--t-bod:calc(12.5px*var(--s));
--t-med:calc(15px*var(--s));--t-lg:calc(20px*var(--s));--t-hero:calc(30px*var(--s));
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:var(--n-100);color:var(--n-900);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button{font-family:inherit;cursor:pointer}

.devbar{position:sticky;top:0;z-index:60;background:#0A2548;color:#fff;padding:9px 18px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.devbar b{font-size:12px;font-weight:700}
.devbar .h{font-size:11px;color:#93a9c9;margin-right:auto}
.devbar button{font-size:11px;font-weight:600;padding:5px 12px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#cddbee;border-radius:6px}
.devbar button.on{background:#fff;color:#0A2548;border-color:#fff}

.nav{background:var(--n-0);border-bottom:1px solid var(--n-300);padding:0 24px;height:56px;display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.02em}
.mark{width:26px;height:26px;border-radius:50%;background:var(--navy-700);color:#fff;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center}
.navlinks{display:flex;gap:22px;margin:0 auto}
.navlinks span{font-size:13px;font-weight:600;color:var(--n-700)}
.navlinks span.on{color:var(--navy-700);background:var(--navy-100);padding:6px 12px;border-radius:8px;margin:-6px -12px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--navy-700);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}

.wrap{padding:18px 22px 60px;max-width:1560px;margin:0 auto}
.cmd{background:var(--navy-700);border-radius:12px 12px 0 0;padding:13px 18px;display:flex;align-items:center;gap:11px;flex-wrap:wrap;position:relative}
.cmd .ttl{color:#fff;font-size:var(--t-med);font-weight:700}
.cmd .acct{color:#fff;font-size:var(--t-med);font-weight:800}
.chip{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:5px 11px;display:flex;align-items:center;gap:7px;cursor:pointer}
.chip:hover{background:rgba(255,255,255,.17)}
.chip .k{color:#93a9c9;font-size:var(--t-lab);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.chip .v{color:#fff;font-size:var(--t-bod);font-weight:600}
.chip .d{color:#93a9c9;font-size:var(--t-bod);font-weight:500}
.meta{color:#b9c8de;font-size:var(--t-met);font-weight:600;letter-spacing:.04em}
.meta b{color:#fff;font-weight:700}
.tog{display:flex;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);border-radius:8px;overflow:hidden;margin-left:auto}
.tog button{font-size:var(--t-bod);font-weight:700;padding:6px 14px;color:#cddbee;background:transparent;border:none}
.tog button.on{background:#fff;color:var(--navy-700)}
.tog button.ona{background:var(--amber-500);color:#fff}
.fresh{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 11px;color:#dbe6f5;font-size:var(--t-met);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:#54B56B}
.rmenu{position:absolute;top:52px;left:18px;background:var(--n-0);border:1px solid var(--n-300);border-radius:10px;padding:12px;z-index:40;box-shadow:0 8px 28px rgba(10,37,72,.16);display:none}
.rmenu.on{display:block}
.rmenu h4{font-size:var(--t-lab);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--n-600);margin-bottom:7px}
.rmenu .row{display:flex;gap:5px;flex-wrap:wrap;max-width:330px}
.rmenu button{font-size:var(--t-met);font-weight:700;padding:5px 10px;border:1px solid var(--n-300);background:var(--n-0);border-radius:6px;color:var(--n-700)}
.rmenu button.on{background:var(--navy-700);border-color:var(--navy-700);color:#fff}

.body{display:grid;grid-template-columns:236px minmax(0,1fr);gap:16px;background:var(--n-100);padding:16px;border-radius:0 0 12px 12px;border:1px solid var(--n-300);border-top:none;align-items:start}
.body.solo{grid-template-columns:minmax(0,1fr)}
.rail h2{font-size:var(--t-lab);font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin-bottom:2px}
.rail .sub{font-size:var(--t-met);color:var(--n-600);font-weight:500;margin-bottom:11px}
.grp{background:var(--n-0);border:1px solid var(--n-300);border-radius:10px;margin-bottom:11px;overflow:hidden}
.grp .hd{padding:9px 12px;border-bottom:1px solid var(--n-200);display:flex;align-items:center;cursor:pointer}
.grp .hd:hover{background:var(--n-50)}
.grp .hd.sel{background:var(--navy-50);box-shadow:inset 3px 0 0 var(--navy-700)}
.grp .hd .nm{font-size:var(--t-lab);font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.grp .hd .rd{font-size:var(--t-met);color:var(--n-600);font-weight:500;display:block;letter-spacing:0;text-transform:none}
.grp .hd .ct{margin-left:auto;font-size:var(--t-met);font-weight:700;color:var(--n-600);background:var(--n-100);border-radius:999px;padding:2px 8px}
.acc{padding:9px 12px;border-bottom:1px solid var(--n-200);cursor:pointer}
.acc:last-child{border-bottom:none}
.acc:hover{background:var(--n-50)}
.acc .k{font-size:var(--t-bod);font-weight:700}
.acc .t{font-size:var(--t-met);color:var(--n-600);font-weight:500}
.acc.sel{background:var(--navy-50);box-shadow:inset 3px 0 0 var(--navy-700)}
.all{background:var(--n-0);border:1px solid var(--n-300);border-radius:10px;padding:10px 12px;margin-bottom:11px;display:flex;align-items:center;cursor:pointer}
.all.sel{background:var(--navy-700);border-color:var(--navy-700)}
.all .k{font-size:var(--t-bod);font-weight:800}.all .t{font-size:var(--t-met);color:var(--n-600);font-weight:500}
.all.sel .k{color:#fff}.all.sel .t{color:#b9c8de}
.all .ct{margin-left:auto;font-size:var(--t-met);font-weight:700;color:var(--n-600);background:var(--n-100);border-radius:999px;padding:2px 8px}
.all.sel .ct{background:rgba(255,255,255,.16);color:#fff}

.card{background:var(--n-0);border:1px solid var(--n-300);border-radius:10px}
.ag{border-left:3px solid var(--green-600)}.ab{border-left:3px solid var(--navy-700)}
.ap{border-left:3px solid var(--purple)}.aa{border-left:3px solid var(--amber-500)}
.ch{display:flex;align-items:center;gap:8px;padding:11px 14px 0}
.ch .eb{font-size:var(--t-lab);font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--n-700)}
.ch .gl{font-size:var(--t-met);color:var(--n-600);font-weight:600}
.q{width:15px;height:15px;border-radius:50%;border:1px solid var(--n-400);color:var(--n-600);font-size:9px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;background:var(--n-0);position:relative}
.q:hover{background:var(--navy-700);color:#fff;border-color:var(--navy-700)}
.q .tip{display:none;position:absolute;bottom:22px;left:-8px;width:250px;background:var(--n-900);color:#fff;font-size:var(--t-met);font-weight:500;line-height:1.5;padding:9px 11px;border-radius:8px;z-index:30;text-transform:none;letter-spacing:0}
.q:hover .tip{display:block}
.pill{margin-left:auto;font-size:var(--t-met);font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.pok{background:var(--green-50);color:var(--green-600)}
.pwa{background:var(--amber-50);color:var(--amber-600)}
.pba{background:var(--red-50);color:var(--red-600)}
.pne{background:var(--n-100);color:var(--n-700)}
.cb{padding:9px 14px 14px}
.hero{font-size:var(--t-hero);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.sub2{font-size:var(--t-met);color:var(--n-600);font-weight:600;margin-top:4px}
.ok{color:var(--green-600)}.bad{color:var(--red-600)}.wa{color:var(--amber-600)}
.kv{display:flex;gap:22px;margin-top:11px;padding-top:9px;border-top:1px dashed var(--n-300);flex-wrap:wrap}
.kv .k{font-size:var(--t-lab);font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--n-600)}
.kv .v{font-size:var(--t-bod);font-weight:700;margin-top:2px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mt{margin-top:12px}

table{width:100%;border-collapse:collapse;font-size:var(--t-bod)}
th{font-size:var(--t-lab);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--n-600);text-align:right;padding:0 0 7px}
th.l{text-align:left}
td{padding:6px 0;border-top:1px solid var(--n-200);text-align:right;font-weight:600}
td.l{text-align:left}
tr.sect td{border-top:none;padding:13px 0 3px;font-size:var(--t-lab);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--n-600);text-align:left}
tr.tot td{border-top:1px solid var(--n-400);font-weight:800}
tr.gm td{border-top:2px solid var(--navy-700);font-weight:800;padding-top:9px;font-size:var(--t-med)}
tr.ind td{color:var(--n-700);font-weight:500}
tr.ind td.l{padding-left:16px}
tr.dr:hover{background:var(--navy-50);cursor:pointer}
.glc{font-size:var(--t-met);color:var(--n-600);font-weight:600;margin-right:6px;display:inline-block;min-width:36px}
.drill{color:var(--navy-700);font-size:var(--t-met);font-weight:700;margin-left:7px}
.absent{background:var(--amber-50);color:var(--amber-600);font-size:var(--t-met);font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.fixedp{background:var(--navy-100);color:var(--navy-700);font-size:var(--t-met);font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.seed{background:var(--amber-50);color:var(--amber-600);border:1px solid #F7C299;font-size:var(--t-met);font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.nb{color:var(--n-600);font-weight:600}

.bars{display:flex;align-items:flex-end;gap:7px;height:96px}
.bars i{flex:1;border-radius:2px 2px 0 0;display:block;min-height:2px}
.bok{background:var(--green-500)}.bba{background:var(--red-500)}
.bpr{background:repeating-linear-gradient(45deg,var(--navy-700),var(--navy-700) 3px,transparent 3px,transparent 7px);border:1px solid var(--navy-700);border-bottom:none}
.axis{display:flex;gap:7px;margin-top:5px}
.axis span{flex:1;text-align:center;font-size:var(--t-met);color:var(--n-600);font-weight:700}
.axis small{display:block;font-weight:500;color:var(--n-500);font-size:calc(10px*var(--s))}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--t-met);color:var(--n-600);font-weight:600;margin-top:9px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
.note{font-size:var(--t-met);color:var(--n-600);font-weight:500;margin-top:10px;line-height:1.55}

.fold{background:var(--n-0);border:1px solid var(--n-300);border-radius:10px;margin-top:12px;padding:12px 14px;display:flex;align-items:center;gap:9px;cursor:pointer}
.fold:hover{background:var(--n-50)}
.fold .eb{font-size:var(--t-lab);font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--n-700)}
.fold .hx{font-size:var(--t-met);color:var(--n-600);font-weight:500}
.fold .cv{margin-left:auto;color:var(--n-600);font-size:13px;font-weight:700}
.seg{display:flex;border:1px solid var(--n-300);border-radius:7px;overflow:hidden;margin-left:auto}
.seg button{font-size:var(--t-met);font-weight:700;padding:4px 11px;color:var(--n-600);background:var(--n-0);border:none}
.seg button.on{background:var(--navy-700);color:#fff}

.tracked{background:var(--n-50);border:1px dashed var(--n-400);border-radius:10px;margin-top:12px;padding:12px 14px}
.tracked .hd2{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.tracked .eb{font-size:var(--t-lab);font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--n-700)}
.tracked .sl{font-size:var(--t-met);color:var(--n-600);font-weight:500;margin-bottom:9px}

.banner{background:var(--amber-50);border:1px solid #F7C299;border-radius:8px;padding:9px 13px;margin-bottom:12px;font-size:var(--t-bod);font-weight:600;color:var(--amber-600)}
.verdict{background:linear-gradient(180deg,var(--navy-50),var(--n-0));border:1px solid var(--n-300);border-left:4px solid var(--green-600);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.verdict.warn{border-left-color:var(--amber-500)}
.verdict .big{font-size:calc(22px*var(--s));font-weight:800;letter-spacing:-.02em;line-height:1.25}
.verdict .say{font-size:var(--t-bod);color:var(--n-700);font-weight:500;margin-top:7px;line-height:1.65;max-width:78ch}
.bigc{padding:15px 17px}
.bigc .lbl{font-size:calc(13px*var(--s));font-weight:700;color:var(--n-700)}
.bigc .hero{font-size:calc(34px*var(--s));margin-top:4px}
.plain{font-size:var(--t-bod);color:var(--n-700);font-weight:500;line-height:1.55;margin-top:7px}
.mover{display:flex;align-items:baseline;gap:9px;padding:8px 0;border-top:1px solid var(--n-200)}
.mover:first-child{border-top:none}
.mover .nm{font-weight:700;font-size:var(--t-bod)}
.mover .wh{font-size:var(--t-met);color:var(--n-600);font-weight:500;display:block}
.mover .vl{margin-left:auto;font-weight:800;font-size:var(--t-bod);white-space:nowrap}
.dr2{display:flex;align-items:center;gap:12px;background:var(--n-0);border:1px solid var(--n-300);border-radius:10px;padding:14px 16px;cursor:pointer}
.dr2:hover{border-color:var(--navy-700);background:var(--navy-50)}
.dr2 .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px}
.dr2 .t1{font-size:calc(14px*var(--s));font-weight:700}
.dr2 .t2{font-size:var(--t-met);color:var(--n-600);font-weight:500;margin-top:2px}
.dr2 .go{margin-left:auto;color:var(--navy-700);font-weight:800;font-size:15px}
.cap{font-size:11px;color:var(--n-600);padding:12px 22px 0;max-width:1560px;margin:0 auto;line-height:1.6}
.cap b{color:var(--n-900)}
</style>
<style>
/* v3 additions */
.stc{font-size:var(--t-met);font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;position:relative;cursor:default}
.stc-open{background:var(--amber-50);color:var(--amber-600)}
.stc-wait{background:var(--n-100);color:var(--n-700)}
.stc-ver{background:var(--green-50);color:var(--green-600)}
.stc .tip{display:none;position:absolute;top:24px;left:0;width:280px;background:var(--n-900);color:#fff;font-size:var(--t-met);font-weight:500;line-height:1.55;padding:9px 11px;border-radius:8px;z-index:30;text-align:left}
.stc:hover .tip{display:block}
.src{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--t-met);color:var(--n-600);font-weight:600;margin-bottom:12px;padding:8px 12px;background:var(--n-0);border:1px solid var(--n-300);border-radius:8px}
.src b{color:var(--n-900);font-weight:700}
.src .lagx{color:var(--amber-600)}
.kpi{display:flex;align-items:baseline;gap:8px;margin-top:6px;flex-wrap:wrap}
.kpi .pa{font-size:calc(22px*var(--s));font-weight:800;letter-spacing:-.02em}
.kpi .vs{font-size:var(--t-bod);color:var(--n-600);font-weight:600}
.kpi .pt{font-size:var(--t-bod);font-weight:800;padding:2px 8px;border-radius:6px}
.pt-ok{background:var(--green-50);color:var(--green-600)}
.pt-bad{background:var(--red-50);color:var(--red-600)}
.pt-neu{background:var(--n-100);color:var(--n-700)}
.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:11px;padding-top:9px;border-top:1px dashed var(--n-300)}
.money .k{font-size:var(--t-lab);font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--n-600)}
.money .v{font-size:var(--t-bod);font-weight:700;margin-top:2px}
.brk{margin-top:9px;font-size:var(--t-met)}
.brk div{display:flex;gap:8px;padding:4px 0;border-top:1px solid var(--n-200);color:var(--n-700);font-weight:500}
.brk div span:last-child{margin-left:auto;font-weight:700;color:var(--n-900)}
.brk div span.bud{margin-left:0;color:var(--n-500);font-weight:600}
.bars{position:relative}
.bars .tgt{position:absolute;left:0;right:0;border-top:2px dashed var(--amber-500);pointer-events:none}
.bars .tgt em{position:absolute;right:0;top:-16px;font-style:normal;font-size:var(--t-lab);font-weight:800;letter-spacing:.06em;color:var(--amber-600);text-transform:uppercase}
.bars i{position:relative}
.bars i .bt{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--n-900);color:#fff;font-size:var(--t-met);font-weight:500;line-height:1.5;padding:7px 10px;border-radius:7px;white-space:nowrap;z-index:20}
.bars i:hover .bt{display:block}
.bars i.dash{background:transparent;border-bottom:2px dashed var(--n-400);height:2px;align-self:flex-end;border-radius:0}
.lev th{white-space:nowrap}
.lev td.l{font-weight:700}
.verdict .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.verdict .st{font-size:var(--t-met);font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.verdict.ahead{border-left-color:var(--green-600)}.verdict.ontrack{border-left-color:var(--navy-700)}
.verdict.behind{border-left-color:var(--amber-500)}.verdict.risk{border-left-color:var(--red-600)}
.verdict .pace{font-size:var(--t-met);color:var(--n-600);font-weight:600;margin-top:8px}
.plannote{font-size:var(--t-met);color:var(--amber-600);font-weight:600;margin-top:5px}
.saltog{display:flex;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);border-radius:8px;overflow:hidden;margin-left:auto;position:relative}
.saltog button{font-size:var(--t-bod);font-weight:700;padding:6px 12px;color:#cddbee;background:transparent;border:none}
.saltog button.on{background:#fff;color:var(--navy-700)}
.saltog button.ona{background:var(--amber-500);color:#fff}
.gate{font-size:var(--t-lab);color:#93a9c9;font-weight:700;letter-spacing:.06em;text-transform:uppercase;align-self:center;margin-left:8px}
</style>
<style>
/* v4 additions */
.ticker{display:flex;align-items:stretch;flex-wrap:wrap;background:var(--n-0);border:1px solid var(--n-300);border-radius:10px;margin-bottom:12px;overflow:hidden}
.ticker .tk{display:flex;flex-direction:column;justify-content:center;padding:10px 16px;border-right:1px solid var(--n-200);min-width:0}
.ticker .tk:last-child{border-right:none}
.ticker .tk .k{font-size:var(--t-lab);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--n-600)}

 ["WEST REGION","RDO R. Moore",[["CIN - AZ","Cincinnati Reds · Goodyear, AZ"],["CIN - KY","Louisville Bats · Louisville, KY"],["CIN - OH","Cincinnati Reds · Cincinnati, OH"],["TXR - AZ","Texas Rangers · Surprise, AZ"],["TXR - TX - H","Rangers · Home · Arlington, TX"],["TXR - TX - V","Rangers · Visitor · Arlington, TX"]]]];
const MODEL={"CIN - AZ":"per-meal","CIN - KY":"per-meal","CIN - OH":"fee","STL - FL":"fee","STL - MO":"fee","TBJ - FL":"per-meal","TBJ - NY":"per-meal","TBR - FL":"per-meal","TXR - AZ":"per-meal","TXR - TX - H":"fee","TXR - TX - V":"direct"};
const PASS={"CIN - OH":1,"STL - MO":1};

const PKGGAP={"CIN - KY":1,"STL - FL":1};

/* ---- time ---- */
const TODAY="08/31", DATA_THRU="08/30", CARDS_THRU="08/30";   /* cards nightly - CC to confirm */
const P9_DAYS=28, P9_ELAPSED=21, PRO=P9_ELAPSED/P9_DAYS;   /* days through yesterday */
const WK_CLOSED=3, WK_TOTAL=4;
const R_FYTD=0,R_THIS=1,R_LAST=2;
const RANGES=[
 {lab:"FYTD",slab:"This year so far",sub:"12/29/25 – 08/30/26",open:true,state:"open"},
 {lab:"This period",slab:"This period",sub:"P9 · 08/10 – 09/06",open:true,state:"open"},
 {lab:"Last period",slab:"Last period",sub:"P8 · 07/13 – 08/09",open:false,state:"verified"}];
const STATES={
 open:['stc-open','open · live estimate',"Numbers update nightly from labor, purchasing and the Service Calendar. Nothing is final until the period closes and is verified against the finance P&L."],
 wait:['stc-wait','closed · awaiting finance',"The period has closed. Our numbers are final on our side, but finance has not yet issued the P&L, so they are not yet verified."],
 verified:['stc-ver','verified against P&L · 08/20',"Closed, and Kevin has matched these figures against the finance P&L issued 08/20. This is the confirmed record."]};

/* P9 live estimate: ~75% of a period at the P8 run rate, deterministic per account+line */
function seedf(k){let h=0;for(let i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))%1000;return 0.66+(h%180)/1000;}
function p9est(acct,key){const d=PNL[acct];if(!d||!d[key])return 0;return d[key].a[7]*seedf(acct+key);}

let S={role:"site",acct:"CIN - AZ",mode:"planned",range:R_THIS,stmt:false,dense:"sum",rmenu:false,salary:false};
const $=id=>document.getElementById(id);
const m=n=>(n<0?"−$":"$")+Math.abs(Math.round(n)).toLocaleString("en-US");
const pct=(a,b)=>b?(a/b*100):0;
const pf=x=>x.toFixed(1)+"%";
const gap=(x,good,bad)=>Math.abs(x).toFixed(1)+"% "+(x>=0?good:bad);   /* x>0 means the good direction */
const gapd=(x,good,bad)=>m(Math.abs(x))+" "+(x>=0?good:bad);
const R=()=>RANGES[S.range];
const isOpen=()=>R().open;
const scMode=()=>S.role==="corp"&&S.mode==="sc";
function keys(){return S.acct==="ALL"?ALLK:S.acct==="EAST"?ACCTS[0][2].map(a=>a[0]):S.acct==="WEST"?ACCTS[1][2].map(a=>a[0]):[S.acct];}

/* [budgetToDate, actualToDate, periodBudget, fullYearBudget] over the active range.
   Revenue lines follow the source rule: closed periods use finance actuals; the open period uses planned
   (contractual for fee accounts) unless the corporate SC-revenue mode is on for a per-meal account.
   Cost lines are always live. */
const REVK={r2200:1,r2300:1,r2400_1:1,r2400_2:1,r2600:1,totRev:1};
function openRev(k,key,d){ if(REVK[key]&&!(scMode()&&(SEEDED[k]))) return d[key].b[8]*PRO; return p9est(k,key); }
function L(key){
  let b=0,a=0,pb=0,fy=0;
  keys().forEach(k=>{const d=PNL[k];if(!d||!d[key])return; fy+=d[key].fy;
    if(S.range===R_LAST){b+=d[key].b[7];a+=d[key].a[7];pb+=d[key].b[7];}
    else if(S.range===R_THIS){b+=d[key].b[8]*PRO;a+=openRev(k,key,d);pb+=d[key].b[8];}
    else{for(let i=0;i<8;i++){b+=d[key].b[i];a+=d[key].a[i];pb+=d[key].b[i];}b+=d[key].b[8]*PRO;a+=openRev(k,key,d);pb+=d[key].b[8];}
  });
  return [b,a,pb,fy];
}
const val=p=>p[1];
function tip(t){return '<span class="q">?<span class="tip">'+t+'</span></span>'}
function stChip(){const s=STATES[R().state];return '<span class="stc '+s[0]+'">'+s[1]+'<span class="tip">'+s[2]+'</span></span>';}

/* revenue source state for the active range */
function siteRev(){
  const r=L("totRev");
  const planned=isOpen()&&!scMode()&&keys().some(k=>SEEDED[k]||MODEL[k]==="direct");
  return {b:r[0],v:r[1],pb:r[2],fy:r[3],planned};
}

/* ---------- charts: cost of goods sold vs budget (below the line is good) ---------- */
function btip(title,rows,res){let h='<span class="bt"><div class="bth">'+title+'</div>';rows.forEach(r=>{h+='<div class="btr"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>';});if(res)h+='<div class="btr res"><span>'+res[0]+'</span><b>'+res[1]+'</b></div>';return h+'</span>';}
function chartFY(){
  const cb=[],ca=[];
  for(let i=0;i<9;i++){let x=0,y=0;keys().forEach(k=>{const d=PNL[k];if(!d)return;x+=(d.totCOGS.b[i]||0)*(i===8?PRO:1);y+= i<8?d.totCOGS.a[i]:p9est(k,"totCOGS");});cb.push(x);ca.push(y);}
  const A=ca,mx=Math.max(...A,...cb,1);
  let h='<div class="card ab mt"><div class="ch"><span class="eb">Cost of goods sold, period by period</span><span class="gl">bars are spend · line is budget</span>'+tip("Each period's cost of goods sold against its budget. Below the line is under budget. Period 9 is still running, so it is hatched. Hover a bar for the numbers.")+'<span class="pill pne">9 periods</span></div><div class="cb"><div class="bars2">';
  A.forEach((v,i)=>{const hgt=Math.max(2,Math.round(v/mx*100));
    const over=v-cb[i];
    h+='<i class="'+(i===8?"bpr":(v<=cb[i]?"bok":"bba"))+'" style="height:'+hgt+'%">'+btip('P'+(i+1)+(i===8?' · running':''),[["Spent",m(v)],["Budget",m(cb[i])]],i===8?null:[over<=0?"Under":"Over",m(Math.abs(over))])+'</i>';});
  h+='</div><div class="axis2">';
  A.forEach((v,i)=>{h+='<span>P'+(i+1)+'<span class="amt '+(i===8?"nb":(v<=cb[i]?"ok":"bad"))+'">'+(i===8?"running":m(v))+'</span></span>';});
  h+='</div><div class="legend"><span><i class="bok"></i>under budget</span><span><i class="bba"></i>over budget</span><span><i class="bpr"></i>still running</span></div></div></div>';
  return h;
}
function chartWeeks(){
  const cog=L("totCOGS"),open=isOpen(),wkB=cog[2]/WK_TOTAL,done=open?WK_CLOSED:WK_TOTAL;
  const split=[0.31,0.36,0.33,0.30],tot=split.slice(0,done).reduce((s,x)=>s+x,0);
  const wa=[];for(let i=0;i<done;i++)wa.push(cog[1]*split[i]/tot);
  const mx=Math.max(wkB,...wa,1);
  const dates=S.range===R_THIS?["08/10 – 08/16","08/17 – 08/23","08/24 – 08/30","08/31 – 09/06"]:["07/13 – 07/19","07/20 – 07/26","07/27 – 08/02","08/03 – 08/09"];
  let h='<div class="card ab mt"><div class="ch"><span class="eb">Cost of goods sold, week by week</span><span class="gl">bars are spend · line is the weekly budget</span>'+
   tip(open?"Three weeks closed. Week 4 started today and has no data yet, so it shows a dash - not a zero. Below the line is under budget.":"All four weeks closed. Below the line is under budget.")+'<span class="pill '+(open?"pwa":"pne")+'">'+(open?"3 of 4 weeks closed":"4 of 4 closed")+'</span></div><div class="cb"><div class="bars2">';
  h+='<div class="tgt" style="bottom:'+Math.round(wkB/mx*100)+'%"><em>budget '+m(wkB)+' / wk</em></div>';
  for(let i=0;i<WK_TOTAL;i++){
    if(i<done){const hgt=Math.max(2,Math.round(wa[i]/mx*100)),over=wa[i]-wkB;
      h+='<i class="'+(wa[i]<=wkB?"bok":"bba")+'" style="height:'+hgt+'%">'+btip('Week '+(i+1)+' · '+dates[i],[["Spent",m(wa[i])],["Budget",m(wkB)]],[over<=0?"Under":"Over",m(Math.abs(over))])+'</i>';}
    else h+='<i class="dash">'+btip('Week '+(i+1)+' · '+dates[i],[["Starts today","no data yet"]])+'</i>';}
  h+='</div><div class="axis2">';
  for(let i=0;i<WK_TOTAL;i++){h+='<span>Week '+(i+1)+'<small>'+dates[i]+'</small><span class="amt '+(i<done?(wa[i]<=wkB?"ok":"bad"):"nb")+'">'+(i<done?m(wa[i]):"— starts today")+'</span></span>';}
  h+='</div></div></div>';
  return h;
}
const chart=()=>S.range===R_FYTD?chartFY():chartWeeks();

/* ---------- statement ---------- */
function row(lbl,gl,key,o){
  o=o||{};const p=L(key),rv=L("totRev")[1],rb=L("totRev")[0];
  const b=p[0],v=p[1],pb=p[2];
  const open=isOpen(),site=S.role==="site";
  let cells;
  if(b===0&&v===0) cells=(open?'<td class="nb">—</td>':'')+'<td class="nb">—</td><td class="nb">—</td><td class="nb">not active</td><td class="nb">—</td><td class="nb">—</td>';
  else{
    const pa=pct(v,rv),pbg=pct(b,rb),dv=v-b,good=o.rev?dv>=0:dv<=0;
    const ptsv=(pa-pbg)*(o.rev?1:-1);
    cells=(open?'<td class="num nb">'+m(pb)+'</td>':'')+'<td class="num">'+m(b)+'</td><td class="num">'+m(v)+'</td>'+
      (o.novar?'<td><span class="fixedp">contractual</span></td>':(Math.abs(dv)<1?'<td class="num nb">on budget</td>':'<td class="num '+(good?"ok":"bad")+'">'+gapd(o.rev?dv:-dv,(o.rev?"above":"under"),(o.rev?"below":"over"))+'</td>'))+
      '<td class="num">'+pf(pa)+'</td><td class="num nb">'+pf(pbg)+(o.novar||(b===0)?'':' <span class="'+(ptsv>=0?"ok":"bad")+'">'+gap(ptsv,(o.rev?"above":"under"),(o.rev?"below":"over"))+'</span>')+'</td>';
  }
  return '<tr'+(o.ind?' class="ind"':'')+'><td class="l"><span class="glc num">'+gl+'</span>'+lbl+(o.drill?'<span class="drill">'+o.drill+' →</span>':'')+(o.chip?' <span class="'+o.chip[0]+'">'+o.chip[1]+'</span>':'')+'</td>'+cells+'</tr>';
}
function statement(){
  const site=S.role==="site",open=isOpen(),acct=S.acct,fee=MODEL[acct]==="fee",dense=S.dense==="full";
  const rev=L("totRev"),cog=L("totCOGS");
  const rv=rev[1],cg=cog[1];
  const gmB=rev[0]-cog[0],gm=rv-cg,gmPB=rev[2]-cog[2];
  const gmpA=pct(gm,rv),gmpB=pct(gmB,rev[0]);
  let h='<div class="card ab mt"><div class="ch"><span class="eb">Profit and loss</span><span class="gl">'+(MODEL[acct]||"portfolio")+' · '+R().sub+'</span>'+
   tip("The statement the way finance builds it. Percent of revenue is on every line - that is how each cost is judged, not the dollar alone."+(open?" Period budget is the whole period. Budget to date is that budget for the days elapsed. Actual to date is through last night.":""))+
   '<span class="seg"><button class="'+(dense?"on":"")+'" onclick="setDense(\'full\')">Full</button><button class="'+(!dense?"on":"")+'" onclick="setDense(\'sum\')">Summary</button></span></div><div class="cb">';
  h+='<table><tr><th class="l">Line</th>'+(open?'<th>Period budget</th><th>Budget to date</th><th>Actual to date</th>':'<th>Budget</th><th>Actual</th>')+'<th>Variance</th><th style="width:66px">Actual %</th><th style="width:150px">Target % · vs target</th></tr>';
  h+='<tr class="sect"><td colspan="8">Revenue</td></tr>';
  h+=row("Catering revenue","2200","r2200",{rev:1});
  h+=row("Service charges","2300","r2300",{rev:1});
  h+=row("Meal service (home)","2400.1","r2400_1",{rev:1,novar:fee});
  if(dense){h+=row("Meal service (away)","2400.2","r2400_2",{rev:1,ind:1});h+=row("Consulting","2600","r2600",{rev:1,ind:1});}
  h+='<tr class="tot"><td class="l">Total revenue</td>'+(open?'<td class="num nb">'+m(rev[2])+'</td>':'')+'<td class="num">'+m(rev[0])+'</td><td class="num">'+m(rv)+'</td><td>'+(fee?'<span class="fixedp">contractual</span>':'<span class="num '+(rv-rev[0]>=0?"ok":"bad")+'">'+gapd(rv-rev[0],"above","below")+'</span>')+'</td><td class="num">100%</td><td class="num nb">100%</td></tr>';
  h+='<tr class="sect"><td colspan="8">Cost of goods sold</td></tr>';
  h+=row("Kitchen labor","3100","tot3100",{drill:"Labor"});
  if(dense&&(S.role==="corp"||S.salary)){h+=row("Hourly wages","3100.1","r3100_1",{ind:1});h+=row("Salary wages","3100.2","r3100_2",{ind:1});}
  h+=row("Food purchased","3200","tot3200",{drill:"Purchasing"});
  if(dense){h+=row("General food","3200.1","r3200_1",{ind:1});h+=row("Resale food","3200.2","r3200_2",{ind:1,chip:L("r3200_2")[0]>0?["fixedp","incl. Fun Money"]:null});}
  h+=row("Packaging and supplies","3400","tot3400",{drill:"Purchasing",chip:PKGGAP[acct]?["absent","mapping gap"]:null});
  if(dense){h+=row("Packaging","3400.1","r3400_1",{ind:1});h+=row("Supplies","3400.2","r3400_2",{ind:1});h+=row("Linen","3400.5","r3400_5",{ind:1});}
  h+=row("Vehicle","3500","tot3500",{});
  if(dense){h+=row("Leased vehicle","3500.3","r3500_3",{ind:1});h+=row("Fuel","3500.4","r3500_4",{ind:1});h+=row("Vehicle repair","3500.5","r3500_5",{ind:1});}
  const cpA=pct(cg,rv),cpB=pct(cog[0],rev[0]);
  h+='<tr class="tot"><td class="l">Total cost of goods sold</td>'+(open?'<td class="num nb">'+m(cog[2])+'</td>':'')+'<td class="num">'+m(cog[0])+'</td><td class="num">'+m(cg)+'</td><td class="num '+(cg<=cog[0]?"ok":"bad")+'">'+gapd(cog[0]-cg,"under","over")+'</td><td class="num">'+pf(cpA)+'</td><td class="num nb">'+pf(cpB)+' <span class="'+(cpB-cpA>=0?"ok":"bad")+'">'+gap(cpB-cpA,"under","over")+'</span></td></tr>';
  h+='<tr class="gm"><td class="l">Gross margin</td>'+(open?'<td class="num nb">'+m(gmPB)+'</td>':'')+'<td class="num">'+m(gmB)+'</td><td class="num">'+m(gm)+'</td><td class="num '+(gm>=gmB?"ok":"bad")+'" style="font-size:var(--t-bod)">'+gapd(gm-gmB,"ahead","behind")+'</td><td class="num" style="font-size:var(--t-bod)">'+pf(gmpA)+'</td><td class="num nb" style="font-size:var(--t-bod)">'+pf(gmpB)+' <span class="'+(gmpA-gmpB>=0?"ok":"bad")+'">'+gap(gmpA-gmpB,"ahead","behind")+'</span></td></tr>';
  h+='</table><p class="note"><b>Food purchased</b> is what was bought in this range. Finance adjusts food cost for inventory at close, so the closed number can differ.'+
   (PKGGAP[acct]?' <b>Packaging on this account has a known mapping gap</b> - our figure is incomplete.':'')+
   (siteRev().planned?' <b>Revenue for the open period is planned</b> until this site\'s meal counts are live in the Service Calendar; closed periods use finance actuals.':'')+'</p></div></div>';
  return h;
}
function tracked(){
  const rows=[["General repair and maintenance","5002.1","r5002_1"],["Equipment","5002.5","r5002_5"],["Perks","5017.3","r5017_3"]];
  let h='<div class="tracked"><div class="hd2"><span class="eb">Also tracked</span>'+tip("These sit outside gross margin and cost of goods sold. They are not part of how this account is measured - we watch them together because the site influences them.")+'</div><div class="sl">Not part of gross margin or cost of goods sold - watched together.</div><table>';
  h+='<tr><th class="l">Line</th><th>Budget'+(isOpen()?' to date':'')+'</th><th>Actual'+(isOpen()?' to date':'')+'</th><th style="width:110px">vs budget</th></tr>';

      :(p[0]===0?'<td class="nb">no budget</td><td class="num">'+m(v)+'</td><td class="nb">—</td>'

/* ---------- ticker (rules-based) ---------- */
function banner(){
  const sr=siteRev(),rev=L("totRev"),cog=L("totCOGS");
  const gmpA=pct(sr.v-cog[1],sr.v),gmpB=pct(rev[0]-cog[0],rev[0]),d=gmpA-gmpB;
  const st=d>=1?["ahead","Ahead of target"]:d>=-1?["ontrack","On track"]:d>=-3?["behind","Behind target"]:["risk","At risk"];
  const lines=[["Labor","tot3100"],["Food purchased","tot3200"],["Packaging and supplies","tot3400"],["Vehicle","tot3500"]]
    .map(x=>{const p=L(x[1]);if(p[0]===0)return null;return{n:x[0],dev:pct(p[1],sr.v)-pct(p[0],rev[0])};}).filter(Boolean).sort((a,b)=>Math.abs(b.dev)-Math.abs(a.dev));
  let h='<div class="ticker '+st[0]+'"><span class="st">'+st[1]+'</span>';
  h+='<span class="tk"><span class="k">Gross margin</span><span class="v">'+pf(gmpA)+' <span class="nb" style="font-weight:600">vs '+pf(gmpB)+' target</span><em class="'+(d>=0?"ok":"bad")+'">'+gap(d,"ahead","behind")+'</em></span></span>';
  if(lines[0])h+='<span class="tk"><span class="k">Biggest lever</span><span class="v">'+lines[0].n+'<em class="'+(lines[0].dev<=0?"ok":"bad")+'">'+Math.abs(lines[0].dev).toFixed(1)+'% '+(lines[0].dev>0?"over":"under")+'</em></span></span>';
  if(lines[1]&&Math.sign(lines[1].dev)!==Math.sign(lines[0].dev)&&Math.abs(lines[1].dev)>=0.3)h+='<span class="tk"><span class="k">Offsetting</span><span class="v">'+lines[1].n+'<em class="'+(lines[1].dev<=0?"ok":"bad")+'">'+Math.abs(lines[1].dev).toFixed(1)+'% '+(lines[1].dev>0?"over":"under")+'</em></span></span>';
  h+='<span class="tk"><span class="k">'+(isOpen()?"Through "+DATA_THRU:"Period closed")+'</span><span class="v">'+(isOpen()?(S.range===R_THIS?WK_CLOSED+' of '+WK_TOTAL+' weeks closed':'P9 running · 3 of 4 weeks'):'Verified against P&L 08/20')+'</span></span>';
  if(MODEL[S.acct]==="fee")h+='<span class="tk note"><span class="k">Revenue</span><span class="v">Set by contract - margin is managed through cost of goods sold</span></span>';
  if(PASS[S.acct])h+='<span class="tk note"><span class="k">Food</span><span class="v">Billed back to the client - labor is the main lever</span></span>';
  if(sr.planned)h+='<span class="tk note"><span class="k">Note</span><span class="v">Open-period revenue is planned until meal counts are live</span></span>';
  if(scMode()&&SEEDED[S.acct])h+='<span class="tk note"><span class="k">Test data</span><span class="v">Service Calendar revenue on this account is seeded test data</span></span>';
  return h+'</div>';
}

/* ---------- site leader ---------- */
function site(){
  const sr=siteRev(),rev=L("totRev"),cog=L("totCOGS"),open=isOpen(),fee=MODEL[S.acct]==="fee";
  const rv=sr.v,cg=cog[1],gmB=rev[0]-cog[0],gm=rv-cg;
  const cpA=pct(cg,rv),cpB=pct(cog[0],rev[0]),gpA=pct(gm,rv),gpB=pct(gmB,rev[0]);
  let h=cmdbar()+'<div class="body solo"><div>'+srcline()+banner();
  h+='<div class="g3">';
  /* revenue */
  h+='<div class="card ag"><div class="ch"><span class="eb">Revenue</span><span class="gl">2200 · 2300 · 2400</span>'+tip("What your account bills for the food and service you provide. Everything below is judged as a percent of this number.")+'<span class="pill '+(fee?"pne":(sr.planned?"pwa":"pok"))+'">'+(fee?"Contractual":(sr.planned?"Planned":"On plan"))+'</span></div><div class="cb">'+
     '<div class="hero2 num">'+m(rv)+'</div>'+
     '<div class="kpi2">'+(open?'<span><b>'+m(rev[0])+'</b> budget to date</span><span>· '+(S.range===R_FYTD?m(rev[3])+' full year':m(rev[2])+' period budget')+'</span>':'<span><b>'+m(rev[0])+'</b> budget</span><span class="'+(rv>=rev[0]?"ok":"bad")+'">· '+(fee?'contractual':gapd(rv-rev[0],"above","below"))+'</span>')+'</div>'+
     '<div class="brk">'+[["Meal service","r2400_1"],["Service charges","r2300"],["Catering","r2200"]].map(x=>{const p=L(x[1]);if(p[0]===0&&p[1]===0)return'';return '<div><span>'+x[0]+'</span><span class="bud">budget '+m(p[0])+'</span><span>'+m(p[1])+'</span></div>';}).join('')+'</div></div></div>';
  /* cogs */
  h+='<div class="card ab"><div class="ch"><span class="eb">Cost of goods sold</span><span class="gl">3100 – 3500</span>'+tip("Labor, food purchased, packaging and supplies, vehicle - the lines you control. Finance calls this COGS. Judged as a percent of revenue.")+'<span class="pill '+(cpA<=cpB?"pok":"pba")+'">'+(cpA<=cpB?"Under target":"Over target")+'</span></div><div class="cb">'+
     '<div class="hero2 num '+(cpA<=cpB?"ok":"bad")+'">'+m(cg)+'<small>spent</small></div>'+
     '<div class="kpi2"><b>'+pf(cpA)+'</b><span>of revenue vs '+pf(cpB)+' target</span><span class="g '+(cpB-cpA>=0?"ok":"bad")+'">'+gap(cpB-cpA,"under","over")+'</span></div>'+
     '<div class="kpi2" style="margin-top:6px">'+(open?'<span><b style="font-size:var(--t-bod)">'+m(cog[0])+'</b> budget to date</span><span>· '+(S.range===R_FYTD?m(cog[3])+' full year':m(cog[2])+' period budget')+'</span>':'<span><b style="font-size:var(--t-bod)">'+m(cog[0])+'</b> budget</span><span class="'+(cg<=cog[0]?"ok":"bad")+'">· '+gapd(cog[0]-cg,"under","over")+'</span>')+'</div>'+
     '<div class="mini"><span>Labor <b>'+m(L("tot3100")[1])+'</b></span><span>Food <b>'+m(L("tot3200")[1])+'</b></span><span>Packaging <b>'+m(L("tot3400")[1])+'</b></span>'+(L("tot3500")[1]?'<span>Vehicle <b>'+m(L("tot3500")[1])+'</b></span>':'')+'</div></div></div>';
  /* gm */
  h+='<div class="card ap"><div class="ch"><span class="eb">Gross margin</span>'+tip("Revenue minus cost of goods sold. This is the number the account is measured on. It is before company overhead, so it is not profit.")+'<span class="pill '+(gpA>=gpB?"pok":"pwa")+'">'+(gpA>=gpB?"Ahead":"Behind")+'</span></div><div class="cb">'+
     '<div class="hero2 num">'+m(gm)+'</div>'+
     '<div class="kpi2"><b>'+pf(gpA)+'</b><span>of revenue vs '+pf(gpB)+' target</span><span class="g '+(gpA-gpB>=0?"ok":"bad")+'">'+gap(gpA-gpB,"ahead","behind")+'</span></div>'+
     '<div class="kpi2" style="margin-top:6px">'+(open?'<span><b style="font-size:var(--t-bod)">'+m(gmB)+'</b> budget to date</span><span>· '+(S.range===R_FYTD?m(rev[3]-cog[3])+' full year':m(rev[2]-cog[2])+' period budget')+'</span>':'<span><b style="font-size:var(--t-bod)">'+m(gmB)+'</b> budget</span><span class="'+(gm>=gmB?"ok":"bad")+'">· '+gapd(gm-gmB,"ahead","behind")+'</span>')+'</div>'+
     '<div class="mini"><span>Target for the '+(S.range===R_FYTD?'year':'period')+' <b>'+pf(pct(rev[3+(S.range===R_FYTD?0:-1)]-cog[3+(S.range===R_FYTD?0:-1)],rev[3+(S.range===R_FYTD?0:-1)]))+'</b></span><span>'+(open?'Still moving - the period is open':'Closed and verified')+'</span></div></div></div>';
  h+='</div>';
  /* levers */
  h+='<div class="card aa mt"><div class="ch"><span class="eb">Your cost of goods lines</span><span class="gl">the levers behind gross margin</span>'+tip("Each line as a percent of revenue against its own target. You hit the gross margin target by landing these at or under - or by trading between them.")+'<span class="pill pne">4 lines</span></div><div class="cb"><table class="lev lev2"><colgroup><col class="c0"><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"><col class="c6"></colgroup>';
  h+='<tr><th class="l">Line</th><th>Actual'+(open?' to date':'')+'</th><th>Budget'+(open?' to date':'')+'</th><th>Variance</th><th>Actual %</th><th>Target %</th><th>vs target</th></tr>';
  [["Labor","3100","tot3100"],["Food purchased","3200","tot3200"],["Packaging and supplies","3400","tot3400"],["Vehicle","3500","tot3500"]].forEach(x=>{
    const p=L(x[2]);if(p[0]===0&&p[1]===0){h+='<tr><td class="l"><span class="glc num">'+x[1]+'</span>'+x[0]+'</td><td class="nb">—</td><td class="nb">—</td><td class="nb">not active</td><td class="nb">—</td><td class="nb">—</td><td class="nb">—</td></tr>';return;}
    const pa=pct(p[1],rv),pb=pct(p[0],rev[0]),d=pb-pa,dv=p[1]-p[0];
    if(p[0]===0){h+='<tr><td class="l"><span class="glc num">'+x[1]+'</span>'+x[0]+'</td><td class="num">'+m(p[1])+'</td><td class="nb">no budget</td><td class="nb">—</td><td class="num">'+pf(pa)+'</td><td class="nb">—</td><td class="nb">—</td></tr>';return;}
    h+='<tr><td class="l"><span class="glc num">'+x[1]+'</span>'+x[0]+(PKGGAP[S.acct]&&x[1]==="3400"?' <span class="absent">mapping gap</span>':'')+'</td><td class="num">'+m(p[1])+'</td><td class="num">'+m(p[0])+'</td><td class="num '+(dv<=0?"ok":"bad")+'">'+gapd(-dv,"under","over")+'</td><td class="num">'+pf(pa)+'</td><td class="num nb">'+pf(pb)+'</td><td class="num '+(d>=0?"ok":"bad")+'">'+gap(d,"under","over")+'</td></tr>';});
  h+='<tr class="tot"><td class="l">Total cost of goods sold</td><td class="num">'+m(cg)+'</td><td class="num">'+m(cog[0])+'</td><td class="num '+(cg<=cog[0]?"ok":"bad")+'">'+gapd(cog[0]-cg,"under","over")+'</td><td class="num">'+pf(cpA)+'</td><td class="num nb">'+pf(cpB)+'</td><td class="num '+(cpB-cpA>=0?"ok":"bad")+'">'+gap(cpB-cpA,"under","over")+'</td></tr>';
  h+='</table></div></div>';
  h+=chart();
  /* drills */
  const lab=L("tot3100"),pur=[L("tot3200")[0]+L("tot3400")[0]+L("tot3500")[0],L("tot3200")[1]+L("tot3400")[1]+L("tot3500")[1]];
  const drill=(name,acc,p,thru,inside)=>'<div class="dr3" style="border-left:3px solid '+acc+'"><div class="top"><span class="t1">'+name+'</span><span class="go">→</span></div><div class="grid">'+
    '<div><div class="k">Spent</div><div class="v num">'+m(p[1])+' <small>through '+thru+'</small></div></div>'+
    '<div><div class="k">Of revenue</div><div class="v num">'+pf(pct(p[1],rv))+' <small>target '+pf(pct(p[0],rev[0]))+'</small></div></div>'+
    '<div><div class="k">Inside</div><div class="v"><small>'+inside+'</small></div></div></div></div>';
  h+='<div class="g2 mt">'+drill("Labor","var(--navy-700)",lab,DATA_THRU,"hours, overtime, approvals")+drill("Purchasing","var(--green-600)",pur,CARDS_THRU,"bills, cards, every purchase")+'</div>';
  h+='<div class="fold" onclick="tglStmt()"><span class="eb">Full profit and loss</span><span class="hx">every line the way finance sees it, with percent of revenue</span><span class="cv">'+(S.stmt?"▴":"▾")+'</span></div>';
  if(S.stmt)h+=statement();
  h+=tracked();
  return h+'</div></div>';
}

/* ---------- corporate (shared changes only; full review later) ---------- */
function grid(){
  let h='<div class="card ab mt"><div class="ch"><span class="eb">By account</span><span class="gl">'+R().sub+' · click a row to open it</span>'+tip("A statement is a per-account artifact, so at portfolio level this grid replaces it.")+'<span class="pill pwa">2 with gaps</span></div><div class="cb"><table>';
  h+='<tr><th class="l">Account</th><th class="l" style="width:70px">Model</th><th>Revenue</th><th>COGS</th><th>Gross margin</th><th style="width:66px">GM %</th><th style="width:66px">Target</th><th style="width:112px">Note</th></tr>';
  const save=S.acct;let tr=0,tc=0,trb=0,tcb=0;
  ALLK.forEach(k=>{S.acct=k;const r=L("totRev"),c=L("totCOGS"),rv=r[1],cg=c[1];tr+=rv;tc+=cg;trb+=r[0];tcb+=c[0];
    const note=PKGGAP[k]?'<span class="absent">pkg mapping gap</span>':(MODEL[k]==="fee"?'<span class="fixedp">fee · contractual</span>':(MODEL[k]==="direct"?'<span class="absent">tracked in SC</span>':'<span class="nb">—</span>'));
    h+='<tr class="dr" onclick="pickAcct(\''+k+'\')"><td class="l">'+k+'</td><td class="l nb">'+MODEL[k]+'</td><td class="num">'+(rv?m(rv):'<span class="nb">—</span>')+'</td><td class="num">'+m(cg)+'</td><td class="num">'+(rv?m(rv-cg):'<span class="nb">—</span>')+'</td><td class="num">'+(rv?pf(pct(rv-cg,rv)):'—')+'</td><td class="num nb">'+(r[0]?pf(pct(r[0]-c[0],r[0])):'—')+'</td><td>'+note+'</td></tr>';});
  S.acct=save;
  h+='<tr class="tot"><td class="l">Portfolio</td><td></td><td class="num">'+m(tr)+'</td><td class="num">'+m(tc)+'</td><td class="num">'+m(tr-tc)+'</td><td class="num">'+pf(pct(tr-tc,tr))+'</td><td class="num nb">'+pf(pct(trb-tcb,trb))+'</td><td class="nb">2 gaps</td></tr>';
  h+='</table></div></div>';return h;
}
function corp(){
  const rev=L("totRev"),cog=L("totCOGS"),rv=rev[1],cg=cog[1],gmB=rev[0]-cog[0],gm=rv-cg;
  const port=["ALL","EAST","WEST"].includes(S.acct),fee=MODEL[S.acct]==="fee",open=isOpen(),sr=siteRev();
  const cpA=pct(cg,rv),cpB=pct(cog[0],rev[0]),gpA=pct(gm,rv),gpB=pct(gmB,rev[0]);
  let h=cmdbar()+'<div class="body">'+rail()+'<div>'+srcline()+banner();
  h+='<div class="g3">';
  h+='<div class="card ag"><div class="ch"><span class="eb">Revenue</span><span class="gl">2200 · 2300 · 2400</span>'+tip("What the account bills. Closed periods use finance actuals. The open period uses planned revenue, or contract for fee accounts.")+'<span class="pill '+(fee?"pne":(sr.planned?"pwa":(rv>=rev[0]?"pok":"pba")))+'">'+(fee?"Contractual":(sr.planned?"Planned":(rv>=rev[0]?"Above budget":"Below budget")))+'</span></div><div class="cb"><div class="hero2 num">'+m(rv)+'</div>'+
     '<div class="kpi2">'+(open?'<span><b style="font-size:var(--t-bod)">'+m(rev[0])+'</b> budget to date</span><span>· '+(S.range===R_FYTD?m(rev[3])+' full year':m(rev[2])+' period budget')+'</span>':'<span><b style="font-size:var(--t-bod)">'+m(rev[0])+'</b> budget</span>')+'</div>'+
     '<div class="mini"><span>Meal service <b>'+m(L("r2400_1")[1])+'</b></span>'+(L("r2300")[0]?'<span>Service charges <b>'+m(L("r2300")[1])+'</b></span>':'')+(L("r2200")[0]?'<span>Catering <b>'+m(L("r2200")[1])+'</b></span>':'')+'</div></div></div>';
  h+='<div class="card ab"><div class="ch"><span class="eb">Cost of goods sold</span><span class="gl">3100 – 3500</span>'+tip("Labor, food purchased, packaging and supplies, vehicle.")+'<span class="pill '+(cpA<=cpB?"pok":"pba")+'">'+(cpA<=cpB?"Under target":"Over target")+'</span></div><div class="cb"><div class="hero2 num '+(cpA<=cpB?"ok":"bad")+'">'+m(cg)+'<small>spent</small></div><div class="kpi2"><b>'+pf(cpA)+'</b><span>of revenue vs '+pf(cpB)+' target</span><span class="g '+(cpB-cpA>=0?"ok":"bad")+'">'+gap(cpB-cpA,"under","over")+'</span></div>'+
     '<div class="mini"><span>Labor <b>'+m(L("tot3100")[1])+'</b></span><span>Food <b>'+m(L("tot3200")[1])+'</b></span><span>Packaging <b>'+m(L("tot3400")[1])+'</b></span></div></div></div>';
  h+='<div class="card ap"><div class="ch"><span class="eb">Gross margin</span>'+tip("Revenue minus cost of goods sold. The account-level measure. Stops here - SG&A is not part of it.")+'<span class="pill '+(gpA>=gpB?"pok":"pwa")+'">'+(gpA>=gpB?"Ahead":"Behind")+'</span></div><div class="cb"><div class="hero2 num">'+m(gm)+'</div><div class="kpi2"><b>'+pf(gpA)+'</b><span>of revenue vs '+pf(gpB)+' target</span><span class="g '+(gpA-gpB>=0?"ok":"bad")+'">'+gap(gpA-gpB,"ahead","behind")+'</span></div>'+
     '<div class="mini"><span>Budget'+(open?' to date':'')+' <b>'+m(gmB)+'</b></span><span class="'+(gm>=gmB?"ok":"bad")+'">'+gapd(gm-gmB,"ahead","behind")+'</span></div></div></div>';
  h+='</div>';
  if(port){h+=chart()+grid();}
  else{
    /* levers - same component as the site view */
    h+='<div class="card aa mt"><div class="ch"><span class="eb">Cost of goods lines</span><span class="gl">percent of revenue against target</span>'+tip("Each line as a percent of revenue against its own target.")+'<span class="pill pne">4 lines</span></div><div class="cb"><table class="lev lev2"><colgroup><col class="c0"><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"><col class="c6"></colgroup>';
    h+='<tr><th class="l">Line</th><th>Actual'+(open?' to date':'')+'</th><th>Budget'+(open?' to date':'')+'</th><th>Variance</th><th>Actual %</th><th>Target %</th><th>vs target</th></tr>';
    [["Kitchen labor","3100","tot3100"],["Food purchased","3200","tot3200"],["Packaging and supplies","3400","tot3400"],["Vehicle","3500","tot3500"]].forEach(x=>{
      const p=L(x[2]);if(p[0]===0&&p[1]===0){h+='<tr><td class="l"><span class="glc num">'+x[1]+'</span>'+x[0]+'</td><td class="nb">—</td><td class="nb">—</td><td class="nb">not active</td><td class="nb">—</td><td class="nb">—</td><td class="nb">—</td></tr>';return;}
      if(p[0]===0){h+='<tr><td class="l"><span class="glc num">'+x[1]+'</span>'+x[0]+'</td><td class="num">'+m(p[1])+'</td><td class="nb">no budget</td><td class="nb">—</td><td class="num">'+pf(pct(p[1],rv))+'</td><td class="nb">—</td><td class="nb">—</td></tr>';return;}
      const pa=pct(p[1],rv),pb=pct(p[0],rev[0]),d=pb-pa,dv=p[1]-p[0];
      h+='<tr><td class="l"><span class="glc num">'+x[1]+'</span>'+x[0]+(PKGGAP[S.acct]&&x[1]==="3400"?' <span class="absent">mapping gap</span>':'')+'</td><td class="num">'+m(p[1])+'</td><td class="num">'+m(p[0])+'</td><td class="num '+(dv<=0?"ok":"bad")+'">'+gapd(-dv,"under","over")+'</td><td class="num">'+pf(pa)+'</td><td class="num nb">'+pf(pb)+'</td><td class="num '+(d>=0?"ok":"bad")+'">'+gap(d,"under","over")+'</td></tr>';});
    h+='<tr class="tot"><td class="l">Total cost of goods sold</td><td class="num">'+m(cg)+'</td><td class="num">'+m(cog[0])+'</td><td class="num '+(cg<=cog[0]?"ok":"bad")+'">'+gapd(cog[0]-cg,"under","over")+'</td><td class="num">'+pf(cpA)+'</td><td class="num nb">'+pf(cpB)+'</td><td class="num '+(cpB-cpA>=0?"ok":"bad")+'">'+gap(cpB-cpA,"under","over")+'</td></tr></table></div></div>';
    h+=chart();
    h+='<div class="fold" onclick="tglStmt()"><span class="eb">Profit and loss statement</span><span class="hx">every line, percent of revenue</span><span class="cv">'+(S.stmt?"▴":"▾")+'</span></div>';
    if(S.stmt)h+=statement();
    h+=tracked();}
  return h+'</div></div>';
}
const CAPS={site:'<b>Site leader</b> - built on the management logic: gross margin % is the goal, the COGS %s are the levers, and they trade between lines. Every line shows actual and budget in dollars and in percent of revenue, with the gap stated plainly - under or over, ahead or behind. Ticker at the top is the rules-based summary. Switch the range chip between this year, this period and last period.',
 corp:'<b>Corporate</b> - same engine and structure as the site view with the portfolio rail, GL codes and the account grid at ALL / region. The toggle switches only the open-period revenue source for per-meal accounts: planned revenue (default) or Service Calendar revenue, which is seeded test data until each site is live.'};
function render(){$("app").innerHTML=S.role==="site"?site():corp();$("cap").innerHTML=CAPS[S.role];$("av").textContent=S.role==="corp"?"KF":"JT";}
function pickAcct(a){S.acct=a;if(S.role==="site"&&["ALL","EAST","WEST"].includes(a))S.acct="CIN - AZ";render();}
function setMode(x){S.mode=x;render();}
function setSal(x){S.salary=x;render();}
function setRange(i){S.range=i;S.rmenu=false;render();}
function tglRange(e){e.stopPropagation();S.rmenu=!S.rmenu;render();}
function tglStmt(){S.stmt=!S.stmt;render();}
function setDense(d){S.dense=d;render();}
function setRole(r){S.role=r;S.stmt=false;if(r==="site"&&["ALL","EAST","WEST"].includes(S.acct))S.acct="CIN - AZ";
  $("bCorp").className=r==="corp"?"on":"";$("bSite").className=r==="site"?"on":"";render();}
document.addEventListener("click",()=>{if(S.rmenu){S.rmenu=false;render();}});
render();
</script>
