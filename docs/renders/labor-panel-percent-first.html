<meta charset="utf-8"><title>Labor panel · percent first</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy-700:#153968;--navy-50:#F4F7FC;--amber-50:#FFF7ED;--amber-600:#B25800;
--green-600:#008330;--green-50:#E9FDEC;--red-600:#B9000C;--red-50:#FFEDE7;
--n-0:#FFF;--n-50:#F8FAFC;--n-100:#F1F5F9;--n-200:#E7EDF4;--n-300:#DDE5EE;--n-400:#CBD5E1;--n-600:#64748B;--n-700:#475569;--n-900:#0A2548;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:var(--n-100);color:var(--n-900);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}button{font-family:inherit;cursor:pointer}
.devbar{position:sticky;top:0;z-index:60;background:#0A2548;color:#fff;padding:9px 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.devbar b{font-size:12px}.devbar .h{font-size:11px;color:#93a9c9;margin-right:auto}.devbar .lbl{font-size:11px;color:#93a9c9}
.devbar button{font-size:11px;font-weight:600;padding:5px 11px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#cddbee;border-radius:6px}
.devbar button.on{background:#fff;color:#0A2548;border-color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:18px 22px 40px}
.cap{font-size:11.5px;color:var(--n-600);padding:14px 22px 0;max-width:1180px;margin:0 auto;line-height:1.7}.cap b{color:var(--n-900)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.col h3{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--n-600);margin-bottom:9px}
.col.after h3{color:var(--navy-700)}
.card{background:var(--n-0);border:1px solid var(--n-300);border-radius:10px;box-shadow:0 1px 2px rgba(10,37,72,.04),0 2px 8px rgba(10,37,72,.05)}
.ch{display:flex;align-items:center;gap:8px;padding:13px 17px 0;flex-wrap:wrap}
.ch .eb{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--n-700)}
.pill{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pok{background:var(--green-50);color:var(--green-600)}.pbad{background:var(--red-50);color:var(--red-600)}
.pneu{background:var(--n-100);color:var(--n-700)}.pamb{background:var(--amber-50);color:var(--amber-600)}
.ml{margin-left:auto}
.cb{padding:13px 17px 17px}
/* overview-style row: label left, hero right */
.orow{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:3px 0}
.orow .k{font-size:12.5px;font-weight:700;color:var(--n-600)}
.orow .v{font-size:29px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.orow .v small{font-size:14px;font-weight:700;color:var(--n-600);margin-left:9px}
.orow.ref .v{font-size:21px;color:var(--n-600);font-weight:700}
.orow.ref .v small{font-size:12.5px}
.rule{border-top:2px dashed var(--n-300);margin:13px 0}
.foot{margin-top:13px;padding-top:11px;border-top:1px solid var(--n-200);display:flex;align-items:baseline;justify-content:space-between}
.foot .k{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--n-600)}
.foot .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
/* old style */
.hero{border:1px solid var(--n-300);border-left:4px solid var(--navy-700);border-radius:8px;padding:13px 15px}
.hero .k{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--n-600)}
.hero .v{font-size:27px;font-weight:800;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.hero .d{font-size:10.5px;color:var(--n-600);font-weight:600;margin-top:5px}
.pairrow{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:11px}
.mini{border:1px solid var(--n-300);border-radius:8px;padding:11px 13px}
.mini.ok{border-left:4px solid var(--green-600)}.mini.bad{border-left:4px solid var(--red-600)}
.mini .k{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--n-600)}
.mini .v{font-size:17px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.mini .d{font-size:10px;color:var(--n-600);font-weight:600;margin-top:3px}
.nodata{margin-top:12px;padding:11px 13px;border-radius:9px;background:var(--n-50);border:1px solid var(--n-300);font-size:10.5px;font-weight:600;color:var(--n-700);line-height:1.6}
.nodata b{color:var(--n-900)}
.ovref{max-width:1180px;margin:20px auto 0;padding:0 22px}
.ovref .card{border-top:3px solid var(--navy-700)}
.notes{max-width:1180px;margin:16px auto 0;padding:0 22px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
.notes div{background:var(--n-0);border:1px solid var(--n-300);border-radius:10px;padding:12px 14px;font-size:11.5px;line-height:1.75;color:var(--n-700)}
.notes h4{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--n-900);margin-bottom:6px}
.notes b{color:var(--n-900)}
</style>
<div class="devbar"><b>Labor panel · percent first</b><span class="h">real figures · 2026-09-07</span>
<span class="lbl">account:</span>
<button id="a0" class="on" onclick="setA('TBJ')">TBJ - FL</button>
<button id="a1" onclick="setA('TBR')">TBR - FL</button>
<span style="width:12px"></span><span class="lbl">range:</span>
<button id="g0" class="on" onclick="setG('TY')">This year</button>
<button id="g1" onclick="setG('LP')">Last period</button>
<button id="g2" onclick="setG('TP')">This period</button></div>
<p class="cap" id="cap"></p>
<div class="wrap"><div class="grid" id="app"></div></div>
<div class="ovref" id="ovref"></div>
<div class="notes" id="notes"></div>
<script>
const D={
 "TBJ|TY":{lbl:"Fiscal year · P1 – P9",rev:1834951.72,spent:497989.28,batr:490021.66,actPct:27.14,tgtPct:26.70,ovAct:958117,ovPct:53.0,ovTgt:51.5,ovBatr:930740},
 "TBJ|LP":{lbl:"Period 9 · closed",rev:132080.07,spent:40794.48,batr:44651.76,actPct:30.89,tgtPct:33.81,ovAct:69945,ovPct:53.0,ovTgt:60.0,ovBatr:79227},
 "TBJ|TP":{lbl:"Period 10 · week 1 of 4",rev:null,spent:4221.54,batr:29499.41,actPct:null,tgtPct:33.29,ovAct:4222,ovPct:null,ovTgt:59.5,ovBatr:null},
 "TBR|TY":{lbl:"Fiscal year · P1 – P9",rev:1982781.20,spent:553935.71,batr:570687.45,actPct:27.94,tgtPct:28.78,ovAct:1125979,ovPct:56.8,ovTgt:57.2,ovBatr:1134000},
 "TBR|LP":{lbl:"Period 9 · closed",rev:164429.62,spent:47996.68,batr:48648.53,actPct:29.19,tgtPct:29.59,ovAct:97104,ovPct:58.7,ovTgt:56.9,ovBatr:93600},
 "TBR|TP":{lbl:"Period 10 · week 1 of 4",rev:null,spent:4182.70,batr:34929.00,actPct:null,tgtPct:33.00,ovAct:4183,ovPct:null,ovTgt:58.6,ovBatr:null}};
let A='TBJ', G='TY';
const $=i=>document.getElementById(i);
const m=n=>n==null?"—":(n<0?"-$":"$")+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const m0=n=>n==null?"—":(n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString("en-US");
const p=v=>v==null?"—":v.toFixed(1)+"%";
function before(d){
 const va=d.batr-d.spent, over=va<0;
 return '<div class="card"><div class="ch"><span class="eb">'+d.lbl+'</span><span class="ml"></span>'+
  '<span class="pill '+(over?'pbad':'pok')+'">'+(over?'Over':'On track')+'</span></div><div class="cb">'+
  '<div class="hero"><div class="k">Actual · to date</div><div class="v num">'+m(d.spent)+'</div>'+
  '<div class="d">'+(d.batr?(d.spent/d.batr*100).toFixed(0)+'% of budget':'—')+'</div></div>'+
  '<div class="pairrow"><div class="mini"><div class="k">Adjusted budget</div><div class="v num">'+m0(d.batr)+'</div>'+
  '<div class="d">FY2026 range budget</div></div>'+
  '<div class="mini '+(over?'bad':'ok')+'"><div class="k">'+(over?'Over':'Under')+' budget</div>'+
  '<div class="v num" style="color:'+(over?'var(--red-600)':'var(--green-600)')+'">'+m0(Math.abs(va))+'</div>'+
  '<div class="d">vs budget</div></div></div></div></div>';
}
function after(d){
 const va=d.batr-d.spent, over=va<0;
 const pts=(d.actPct!=null&&d.tgtPct!=null)?Math.abs(d.actPct-d.tgtPct):null;
 let h='<div class="card" style="border-top:3px solid '+(d.actPct==null?'var(--navy-700)':(over?'var(--red-600)':'var(--green-600)'))+'">'+
  '<div class="ch"><span class="eb">Kitchen labour · '+d.lbl+'</span><span class="ml"></span>'+
  (d.actPct==null? '<span class="pill pneu">Nothing earned yet</span>'
   : '<span class="pill '+(over?'pbad':'pok')+'">'+(over?'Over target':'On target')+'</span>')+
  '</div><div class="cb">';
 if(d.actPct!=null){
  h+='<div class="orow"><span class="k">Actual</span><span class="v num" style="color:'+(over?'var(--red-600)':'var(--green-600)')+'">'+p(d.actPct)+'<small>'+m0(d.spent)+'</small></span></div>'+
   '<div class="rule"></div>'+
   '<div class="orow ref"><span class="k">Target</span><span class="v num">'+p(d.tgtPct)+'<small>'+m0(d.batr)+'</small></span></div>'+
   '<div class="foot"><span class="k">'+(over?'Over target':'Under target')+'</span>'+
   '<span class="v" style="color:'+(over?'var(--red-600)':'var(--green-600)')+'">'+(over?'▲ ':'▼ ')+m0(Math.abs(va))+'</span></div>';
 } else {
  h+='<div class="orow"><span class="k">Spent so far</span><span class="v num">'+m0(d.spent)+'</span></div>'+
   '<div class="rule"></div>'+
   '<div class="orow ref"><span class="k">Budget</span><span class="v num">'+m0(d.batr)+'<small>'+p(d.tgtPct)+' target</small></span></div>'+
   '<div class="nodata"><b>No percentage yet.</b> Labour as a percent of revenue needs revenue, and no week of this period has closed. '+
   '<b>'+(d.spent/d.batr*100).toFixed(1)+'% of the budget used.</b></div>';
 }
 h+='</div></div>';
 return h;
}
function ovcard(d){
 const over=d.ovPct!=null&&d.ovPct>d.ovTgt;
 return '<div class="card"><div class="ch"><span class="eb">The Overview&rsquo;s cost of goods card · for comparison</span><span class="ml"></span>'+
  (d.ovPct==null?'<span class="pill pamb">Cost, no revenue yet</span>':'<span class="pill '+(over?'pbad':'pok')+'">'+(over?'Over budget':'Under budget')+'</span>')+
  '</div><div class="cb">'+
  '<div class="orow"><span class="k">Actual</span><span class="v num" style="color:'+(over?'var(--red-600)':'var(--green-600)')+'">'+p(d.ovPct)+'<small>'+m0(d.ovAct)+'</small></span></div>'+
  '<div class="rule"></div>'+
  '<div class="orow ref"><span class="k">Target</span><span class="v num">'+p(d.ovTgt)+'<small>'+m0(d.ovBatr)+'</small></span></div>'+
  '</div></div>';
}
const CAPS={
 TY:'<b>This year.</b> The dollar figure says $7,968 over and sounds like a problem. <b>The percentage says 0.44 points</b> - and the account served 8% more meals than planned, which is why it spent more. <b>That is the KPI.</b>',
 LP:'<b>Last period.</b> $3,857 under in dollars; <b>2.92 points under target</b> in percent. The percentage is the one that survives a busy period.',
 TP:'<b>This period.</b> The case that needs a decision - <b>no week has closed, so there is no revenue to be a percent of.</b> Dollars lead here because a percentage cannot be computed, and the card says why.'};
const NOTES=[
 '<h4>Why percent leads</h4>TBJ - FL P1 – P8: labour was <b>$46,444 over the plan</b> and <b>$13,036 over target</b>. The difference is $33,408 of labour they earned by serving <b>8.08% more revenue than budgeted</b>.<br><br><b>The dollar figure makes a well-run account look like it is failing.</b> The percentage - 27.00% against a 26.23% target - says three quarters of a point.',
 '<h4>Same grammar as the Overview</h4>The Overview&rsquo;s cost card already reads <b>Actual 53.0% $958,117</b> over <b>Target 51.5% $930,740</b>.<br><br>Labor reads <b>$497,989.28</b> with the percent nowhere on the panel. <b>Two boards describing the same account in different languages.</b><br><br>The card below shows the Overview&rsquo;s treatment for the same range so you can compare directly.',
 '<h4>The one case that breaks</h4><b>This period, before any week closes.</b> There is no revenue yet, so there is no percentage.<br><br><b>Dollars lead there and the card says why</b> - "no percentage yet, labour as a percent of revenue needs revenue". <br><br>The alternative is showing a percent against a full-period revenue basis, which would read <b>4.8%</b> and look like a triumph. <b>Not that.</b>'];
function render(){
 const d=D[A+'|'+G];
 $("app").innerHTML='<div class="col"><h3>Today</h3>'+before(d)+'</div>'+
   '<div class="col after"><h3>Percent first</h3>'+after(d)+'</div>';
 $("ovref").innerHTML=ovcard(d);
 $("cap").innerHTML=CAPS[G];
 $("notes").innerHTML=NOTES.map(n=>'<div>'+n+'</div>').join('');
 $("a0").className=A==='TBJ'?'on':''; $("a1").className=A==='TBR'?'on':'';
 ["g0","g1","g2"].forEach((b,i)=>$(b).className=(['TY','LP','TP'][i]===G?'on':''));
}
function setA(a){A=a;render();}
function setG(g){G=g;render();}
render();
</script>
