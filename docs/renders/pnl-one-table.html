  also:[["5002.5","Equipment",231,null,null,21,0.0],
        ["5017.3","Perks",165,null,null,53,0.0]]},
 CP:{lbl:"Current period",span:"P10",closed:false,
  rev:[["2300","Service charges",33994,31.3,33994,16997,null,"prorated · 2/4 wks"],
       ["2400.1","Meal service (home)",74591,68.7,85147,51190,null,"2 of 4 weeks confirmed"]],
  revTot:[108585,100,119141,68187,null],
  cog:[["3100","Kitchen labor",36149,33.3,39663,5377,null,
        [["3100.1","Hourly wages",19762,18.2,21683,1155,null],
         ["3100.2","Salary wages",16386,null,null,4222,null]]],
       ["3200","Food purchased",25009,23.0,27440,0,null,[]],
       ["3400","Packaging and supplies",2655,2.4,2913,0,null,[]],
       ["3500","Vehicle",756,0.7,829,0,null,[]]],
  cogTot:[64567,59.5,70844,5377,null],
  gm:[44017,40.5,48296,null,null],
  also:[]}};
let RNG='CY', VIEW='F', TOG='S';
const $=i=>document.getElementById(i);
const m=n=>n==null?null:(n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString("en-US");
const p=v=>v==null?null:v.toFixed(1)+"%";
const NA='<span class="na" style="display:block;height:calc(12px*var(--s));border-radius:2px"></span>';
function cell(v,cls,fmt){ return '<td class="'+(cls||'')+'">'+(v==null?NA:(fmt?fmt(v):v))+'</td>'; }
function variance(plan,act,isRev){
 if(plan==null||act==null) return '<td>'+NA+'</td>';
 const d=act-plan; if(Math.abs(d)<1) return '<td class="mutc">on budget</td>';
 const good=isRev? d>0 : d<0;
 return '<td class="'+(good?'pos':'neg')+'">'+(d>0?'↑ ':'↓ ')+m(Math.abs(d))+'</td>';
}
function line(l,isRev,sub){
 const running=!D[RNG].closed;
 const [code,name,plan,pct,adj,act,apct,extra]=l;
 const noteRow = typeof extra==='string' ? '<span class="sml">'+extra+'</span>' : '';
 let h='<tr'+(sub?' class="sub"':'')+'><td class="l">'+code+'  '+name+noteRow+'</td>';
 h+=cell(plan,'plan plan-first',m)+cell(pct,'plan',p)+cell(adj,'plan plan-last',m);
 h+=cell(act,'',m)+cell(apct,'',p);
 h+= running ? '<td class="mutc">'+(adj!=null&&act!=null?m(adj-act):NA)+'</td>' : variance(adj!=null?adj:plan,act,isRev);
 return h+'</tr>';
}
function view(){
 const d=D[RNG], running=!d.closed, hourly=TOG==='H';
 const lastCol = running ? 'Left to spend' : 'vs adjusted';
 const actGrp  = running ? 'Landed' : 'Actual';
 let h='<div class="sec"><div class="ch"><span class="eb">Full profit and loss</span><span class="q">?</span>'+
  '<span class="tsw"><button class="'+(VIEW==='F'?'on':'')+'">Full</button><button class="'+(VIEW==='S'?'on':'')+'">Summary</button></span></div>'+
  '<div class="cb" style="padding-top:calc(4px*var(--s))">'+
  '<div style="font-size:calc(11px*var(--s));font-weight:600;color:var(--n600);margin-bottom:calc(8px*var(--s))">TBJ - FL · '+d.span+
   (running?' · projected against '+m(d.revTot[2]):'')+'</div>'+
  '<table class="pnl">'+
  '<tr class="grp"><th class="l"></th><th colspan="3" class="plan grp-plan">Plan</th>'+
  '<th colspan="2">'+actGrp+'</th><th></th></tr>'+
  '<tr><th class="l">Line</th><th class="plan plan-first">Budget</th><th class="plan">Target %</th>'+
  '<th class="plan plan-last">Adjusted</th><th>'+(running?'Landed':'Actual')+'</th><th>% of rev</th><th>'+lastCol+'</th></tr>';
 h+='<tr class="sect"><td colspan="7">Revenue</td></tr>';
 d.rev.forEach(l=>{h+=line(l,true,false);});
 h+='<tr class="tot"><td class="l">Total revenue</td>'+
   cell(d.revTot[0],'plan plan-first',m)+cell(d.revTot[1],'plan',p)+cell(d.revTot[2],'plan plan-last',m)+
   cell(d.revTot[3],'',m)+cell(d.revTot[4],'',p)+
   (running?'<td class="mutc">'+NA+'</td>':variance(d.revTot[0],d.revTot[3],true))+'</tr>';
 h+='<tr class="sect"><td colspan="7">Cost of goods sold</td></tr>';
 d.cog.forEach(l=>{
  const subs=l[7]||[];
  const shown = hourly && l[0]==='3100'
    ? [l[0],l[1],subs[0]?subs[0][2]:l[2],subs[0]?subs[0][3]:l[3],subs[0]?subs[0][4]:l[4],subs[0]?subs[0][5]:l[5],subs[0]?subs[0][6]:l[6]]
    : l;
  h+=line(shown,false,false);
  if(VIEW==='F' && !(hourly && l[0]==='3100')) subs.forEach(s=>{h+=line(s,false,true);});
 });
 h+='<tr class="tot"><td class="l">Total cost of goods sold</td>'+
   cell(d.cogTot[0],'plan plan-first',m)+cell(d.cogTot[1],'plan',p)+cell(d.cogTot[2],'plan plan-last',m)+
   cell(d.cogTot[3],'',m)+cell(d.cogTot[4],'',p)+
   (running?'<td class="mutc">'+m(d.cogTot[2]-d.cogTot[3])+'</td>':variance(d.cogTot[2],d.cogTot[3],false))+'</tr>';
 h+='<tr class="gm"><td class="l">Gross margin</td>'+
   cell(d.gm[0],'plan plan-first',m)+cell(d.gm[1],'plan',p)+cell(d.gm[2],'plan plan-last',m)+
   cell(d.gm[3],'',m)+cell(d.gm[4],'',p)+
   (running?'<td>'+NA+'</td>':variance(d.gm[2],d.gm[3],true))+'</tr>';
 if(d.also.length && VIEW==='F'){
  h+='<tr class="sect"><td colspan="7">Also tracked · outside gross margin</td></tr>';
  d.also.forEach(l=>{h+=line(l,false,false);});
 }
 h+='</table>';
 if(hourly) h+='<div class="note"><b>Hourly view.</b> Kitchen labor shows hourly wages only. Cost of goods sold and gross margin are the full figures.</div>';
 h+='</div></div>';
 return h;
}
const CAPS={
 CY:'<b>Current year · a closed range.</b> Plan, actual and variance. <b>Adjusted</b> is the target percent at the revenue actually earned - blank on revenue lines, where there is nothing to adjust.',
 LP:'<b>Last period · closed, still settling.</b> Same shape as Current year. Every figure here is provisional until P9 crosses 09/14.',
 CP:'<b>Current period · running.</b> Same table, three differences: <b>Adjusted</b> is struck against projected revenue, <b>Actual</b> becomes <b>Landed</b>, and <b>vs adjusted</b> becomes <b>Left to spend</b>. <b>No variance on a period that has not finished.</b>'};
function render(){
 $("app").innerHTML=view();
 $("cap").innerHTML=CAPS[RNG]+' <b>Switch Full / Summary</b> to collapse the sub-lines, and <b>Hourly</b> to see the toggle behaviour.';
 $("notes").innerHTML=[
  '<h4>One structure, three ranges</h4>Group row, plan band, section headers, sub-lines, totals, gross margin, also-tracked. <b>Every range renders the same skeleton.</b><br><br><b>Only three cells change on a running period</b> - the two column names and the last column, which becomes <i>Left to spend</i> because a verdict on an unfinished period is wrong.',
  '<h4>The hatching means one thing</h4><b>A diagonal fill is a cell where the value does not apply</b> - not zero, not missing. Revenue lines have no adjusted figure; <b>3100.2 Salary wages</b> has no target percent.<br><br>Today it is used on Current year and Last period and absent from Current period. <b>Now consistent.</b>',
  '<h4>Type, aligned</h4>Section <b>9.5px/800 navy</b>, lines <b>12.5px/700</b>, sub-lines <b>11px/600 grey</b>, totals <b>12.5px/800 on the navy tint</b>, gross margin <b>reversed on navy</b>.<br><br>The cost-lines table above uses the same scale, so the two read as one family rather than two components.'
 ].map(n=>'<div>'+n+'</div>').join('');
 [['rY','CY'],['rL','LP'],['rP','CP']].forEach(([i,v])=>$(i).className=RNG===v?'on':'');
 $("vF").className=VIEW==='F'?'on':''; $("vS").className=VIEW==='S'?'on':'';
 $("tS").className=TOG==='S'?'on':''; $("tH").className=TOG==='H'?'on':'';
}
function setR(x){RNG=x;render();}
function setV(x){VIEW=x;render();}
function setT(x){TOG=x;render();}
render();
</script>
