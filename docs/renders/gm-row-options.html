<div class="devbar"><b>Gross margin row · three treatments</b><span class="h">TBJ - FL Current year · real figures</span>
<span class="lbl">option:</span>
<button id="oA" onclick="setO('A')">A · as shipped (rejected)</button>
<button id="oB" class="on" onclick="setO('B')">B · plain row, coloured variance (approved)</button>
<button id="oC" onclick="setO('C')">C · navy, variance breaks out (rejected)</button></div>
<p class="cap" id="cap"></p>
<div class="wrap"><div id="app"></div></div>
<div class="notes" id="notes"></div>
<script>
let OPT='B';   /* Kevin ruling 2026-09-08: option B. A and C kept viewable as rejected. */
const $=i=>document.getElementById(i);
const m=n=>(n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString("en-US");
const p=v=>v.toFixed(1)+"%";
const ROWS=[
 ['3400','Packaging and supplies',35509,2.3,38380,37653,2.2,-727,'row'],
 ['3500','Vehicle',6271,0.4,6778,984,0.1,-5794,'row'],
 [null,'Total cost of goods sold',802193,50.9,867038,888172,52.2,21133,'tot'],
 [null,'Gross margin',773322,49.1,835833,814700,47.8,-21133,'gm']];
function view(){
 let h='<div class="sec"><div class="ch"><span class="eb">Full profit and loss</span><span class="q">?</span></div>'+
  '<div class="cb" style="padding-top:calc(4px*var(--s))"><table class="pnl">'+
  '<tr class="grp"><th class="l"></th><th colspan="3" class="plan grp-plan">Plan</th><th colspan="2">Actual</th><th></th></tr>'+
  '<tr><th class="l">Line</th><th class="plan plan-first">Budget</th><th class="plan">Target %</th><th class="plan plan-last">Adjusted</th><th>Actual</th><th>% of rev</th><th>vs adjusted</th></tr>';
 ROWS.forEach(r=>{
  const [code,name,plan,pct,adj,act,apct,varr,kind]=r;
  const cls = kind==='gm' ? 'gm'+OPT : kind;
  const good = kind==='gm' ? varr>0 : varr<0;
  const arrow = varr>0?'↑ ':'↓ ';
  let varCell;
  if(kind==='gm'&&OPT==='A') varCell='<td>'+arrow+m(Math.abs(varr))+'</td>';
  else if(kind==='gm'&&OPT==='C') varCell='<td class="var"><span class="chip '+(good?'pos':'negx')+'">'+arrow+m(Math.abs(varr))+'</span></td>';
  else varCell='<td class="'+(good?'pos':'negx')+'">'+arrow+m(Math.abs(varr))+'</td>';
  h+='<tr class="'+cls+'"><td class="l">'+(code?code+'  ':'')+name+'</td>'+
   '<td class="plan plan-first">'+m(plan)+'</td><td class="plan">'+p(pct)+'</td><td class="plan plan-last">'+m(adj)+'</td>'+
   '<td>'+m(act)+'</td><td>'+p(apct)+'</td>'+varCell+'</tr>';
 });
 h+='</table></div></div>';
 return h;
}
const CAPS={
 A:'<b>A · as shipped.</b> Reversed on navy. The row reads as terminal - everything above accumulates into it. <b>But the variance cell cannot carry a colour</b>, so <b>↓ $21,133</b> - the most important number on the page - reads as neutral.',
 B:'<b>B · plain row, coloured variance.</b> Same treatment as every other row, with navy rules above and below to mark it. <b>The variance is red because the account is behind.</b> Reads as information rather than emphasis.',
 C:'<b>C · navy kept, variance breaks out.</b> The row stays terminal; the variance cell reverses to white with a coloured chip. <b>Both the weight and the verdict.</b> Costs one more rule and a slightly busier row.'};
const NOTES={
